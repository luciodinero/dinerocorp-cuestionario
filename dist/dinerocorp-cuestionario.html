<style>
/* Layout: una sola columna de lectura, cabecera con marca y progreso, navegación fija al pie de cada pantalla. */
:root {
  --bg: #f3f5f1;
  --surface: #ffffff;
  --ink: #18221f;
  --muted: #56625d;
  --line: #d3d9d1;
  --accent: #1d5c47;
  --accent-ink: #ffffff;
  --sel-bg: #e2efe8;
  --warn-bg: #fdf3dc;
  --warn-ink: #6b4a00;
  --err: #a32121;
  --focus: #1f5fd1;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111614; --surface: #1a211e; --ink: #e5ebe7; --muted: #a0aca6; --line: #33403b;
    --accent: #72c6a3; --accent-ink: #0d1a14; --sel-bg: #1d3329; --warn-bg: #3a2f14; --warn-ink: #f2d68f;
    --err: #ff8f8f; --focus: #8fb6ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111614; --surface: #1a211e; --ink: #e5ebe7; --muted: #a0aca6; --line: #33403b;
  --accent: #72c6a3; --accent-ink: #0d1a14; --sel-bg: #1d3329; --warn-bg: #3a2f14; --warn-ink: #f2d68f;
  --err: #ff8f8f; --focus: #8fb6ff; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 17px; line-height: 1.55; margin: 0; }
.wrap { max-width: 44rem; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; }

.skip { position: absolute; left: -9999px; }
.skip:focus { left: 16px; top: 8px; background: var(--surface); padding: 8px 12px; z-index: 10; }

header.top { display: flex; flex-direction: column; gap: 12px; margin-bottom: 28px; }
.brandrow { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; letter-spacing: -0.01em; }
.brand-tag { font-size: .8rem; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.progress { display: flex; flex-direction: column; gap: 6px; }
.progress-text { font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }

h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; line-height: 1.2; letter-spacing: -0.015em; }
h1 { font-size: clamp(1.45rem, 4.2vw, 1.95rem); margin: 0 0 8px; font-weight: 650; }
h2 { font-size: 1.3rem; margin: 0 0 10px; font-weight: 650; }
h3 { font-size: 1.05rem; margin: 0 0 6px; }
h1:focus, h2:focus { outline: none; }
h1:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; border-radius: 4px; }

.eyebrow { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; font-weight: 700; }
.lead { color: var(--muted); margin: 0 0 4px; font-size: 1rem; }
.hint { display: inline-flex; gap: 6px; align-items: center; font-size: .92rem; color: var(--muted); margin: 6px 0 18px; }
.hint b { color: var(--ink); font-weight: 700; }
.muted { color: var(--muted); }

fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
fieldset + fieldset { margin-top: 28px; }
legend.subq { font-family: var(--font-display); font-weight: 650; font-size: 1.15rem; margin-bottom: 6px; padding: 0; }

.opts { display: grid; gap: 10px; }
.opts.compact { grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); }
.opt { display: flex; align-items: flex-start; gap: 12px; padding: 13px 14px; background: var(--surface); border: 1.5px solid var(--line);
  border-radius: var(--radius); cursor: pointer; transition: border-color .12s, background .12s; min-width: 0; }
.opt:hover { border-color: var(--muted); }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.mark { flex: none; width: 22px; height: 22px; margin-top: 1px; border: 2px solid var(--muted); background: var(--surface); display: grid; place-items: center; }
.opt.radio .mark { border-radius: 50%; }
.opt.check .mark { border-radius: 5px; }
.mark::after { content: ""; display: none; }
.opt.radio input:checked + .mark::after { display: block; width: 10px; height: 10px; border-radius: 50%; background: var(--accent-ink); }
.opt.check input:checked + .mark::after { display: block; width: 6px; height: 11px; border: solid var(--accent-ink); border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px, -1px); }
.opt input:checked + .mark { background: var(--accent); border-color: var(--accent); }
.opt:has(input:checked) { border-color: var(--accent); background: var(--sel-bg); }
.opt:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.opt:has(input:disabled) { opacity: .5; cursor: not-allowed; }
.opt .lbl { min-width: 0; overflow-wrap: anywhere; }
.opt .tag { display: block; font-size: .8rem; color: var(--muted); }
.sel-state { font-size: .78rem; font-weight: 700; color: var(--accent); margin-left: auto; padding-left: 8px; white-space: nowrap; }

.textfield { display: grid; gap: 6px; margin-top: 4px; }
.textfield.inline { margin: 2px 0 6px 34px; }
.textfield label { font-size: .92rem; color: var(--muted); }
.textfield input, .textfield textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; }
.textfield textarea { min-height: 6.5rem; resize: vertical; }
.textfield input:focus-visible, .textfield textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; border-color: var(--accent); }
.counter { font-size: .82rem; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

.notice { background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 12px 14px; margin: 0 0 18px; font-size: .95rem; display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.notice strong { font-weight: 700; }
.error { color: var(--err); font-weight: 700; margin: 14px 0 0; display: flex; gap: 8px; align-items: baseline; }
.error[hidden] { display: none; }
.live { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

.nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 32px; flex-wrap: wrap; }
.nav .right { display: flex; gap: 10px; flex-wrap: wrap; margin-left: auto; }
button, .btn { font: inherit; font-weight: 700; border-radius: 8px; padding: 12px 20px; cursor: pointer; border: 1.5px solid transparent; min-height: 48px; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn-ghost:hover { border-color: var(--muted); }
.btn-link { background: none; border: 0; color: var(--accent); padding: 4px 0; min-height: 0; text-decoration: underline; text-underline-offset: 3px; }
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* Pantalla inicial */
.intro h1 { font-size: clamp(1.9rem, 6vw, 2.7rem); margin-bottom: 18px; max-width: 18ch; }
.intro p { max-width: 62ch; }
.intro .note { border-left: 3px solid var(--accent); padding: 4px 0 4px 14px; color: var(--muted); margin: 22px 0 28px; }
.intro .facts { display: flex; gap: 8px 22px; flex-wrap: wrap; font-size: .92rem; color: var(--muted); margin: 0 0 30px; padding: 0; list-style: none; }

/* Informe */
.report section { padding-block: 24px; border-top: 1px solid var(--line); }
.report section:first-of-type { border-top: 0; padding-top: 4px; }
.report p { margin: 0 0 10px; max-width: 65ch; }
.report ul { margin: 0 0 10px; padding-left: 1.2rem; display: grid; gap: 6px; }
.secnum { font-family: var(--font-display); color: var(--accent); font-weight: 700; margin-right: 6px; }
.label-said, .label-infer { display: inline-block; font-size: .75rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; margin-bottom: 6px; }
.label-said { background: var(--sel-bg); color: var(--accent); }
.label-infer { border: 1px dashed var(--muted); color: var(--muted); }
.proposal { background: var(--surface); border: 1.5px solid var(--accent); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px; }
.proposal p:last-child { margin-bottom: 0; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: .95rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 700; }
.features { list-style: none; padding: 0 !important; counter-reset: f; }
.features li { counter-increment: f; display: grid; grid-template-columns: 2rem 1fr; gap: 2px 8px; }
.features li::before { content: counter(f); font-family: var(--font-display); font-weight: 700; color: var(--accent); grid-row: span 2; }
.features .why { color: var(--muted); font-size: .9rem; }
.solidity { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--radius); background: var(--surface); border: 1.5px solid var(--line); }
.solidity .sym { font-family: var(--font-display); font-weight: 700; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; padding: 3px 8px; border-radius: 4px; white-space: nowrap; border: 1.5px solid currentColor; }
.solidity.ok .sym { color: var(--accent); }
.solidity.provisional .sym { color: var(--warn-ink); background: var(--warn-bg); }
.solidity.none .sym { color: var(--muted); }
.ask { border-left: 3px solid var(--accent); padding-left: 12px; font-weight: 700; }
.disclaimer { font-size: .88rem; color: var(--muted); margin-top: 8px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 22px; }
.actions-msg { font-size: .92rem; margin: -10px 0 18px; }
.confirm { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--warn-bg); color: var(--warn-ink); padding: 12px 14px; border-radius: 8px; margin-bottom: 18px; }

/* Revisión */
.review-list { list-style: none; padding: 0; margin: 0 0 24px; display: grid; gap: 0; }
.review-list li { padding: 14px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; align-items: start; }
.review-list .q { font-size: .92rem; color: var(--muted); }
.review-list .a { font-weight: 700; overflow-wrap: anywhere; }
.review-list button { grid-row: span 2; }

@media (max-width: 480px) {
  .nav { flex-direction: column-reverse; }
  .nav .right { margin-left: 0; }
  .nav button { width: 100%; }
  .textfield.inline { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

@media print {
  body { background: #fff; color: #000; font-size: 11pt; }
  header.top .progress, .actions, .actions-msg, .nav, .skip, .confirm, .no-print { display: none !important; }
  .wrap { max-width: none; padding: 0; }
  .proposal, .solidity { border-color: #000; }
  .report section { break-inside: avoid; }
}

<script>
/* =====================================================================
   PREGUNTAS DEL CUESTIONARIO
   ---------------------------------------------------------------------
   Aquí se definen los textos, las opciones y las condiciones de cada
   pantalla. Para cambiar una pregunta, edita su objeto en DC.QUESTIONS.
   Para cambiar el orden o cuándo aparece una pantalla, edita DC.SCREENS.

   Tipos:
     single  → una sola respuesta (botones de opción)
     multi   → varias respuestas (casillas). "max" limita el número.
     text    → campo de texto libre, siempre opcional.
   Opciones:
     exclusive: true   → al marcarla se desmarcan las demás (p. ej. "Ninguna")
     textField: {...}  → campo opcional que aparece al marcar la opción
   La lógica de ramificación (qué situación se explora) está en flow.js.
   ===================================================================== */
window.DC = window.DC || {};

DC.SCALE = [
  { id: 'nunca', label: 'Nunca' },
  { id: 'd12', label: 'En 1–2 días', occurred: true, rank: 1 },
  { id: 'd35', label: 'En 3–5 días', occurred: true, rank: 2 },
  { id: 'd6', label: 'En 6 días o más', occurred: true, rank: 3 },
  { id: 'na', label: 'No me aplica' },
  { id: 'nr', label: 'No lo recuerdo' }
];

/* Situaciones de la sección 2.
   q     → texto de la pregunta (continúa el encabezado común)
   short → texto breve usado en las preguntas 3 y 4
   fact  → frase para el informe ("En 3–5 días … tuviste que …") */
DC.SITUATIONS = {
  A: {
    q: '…has tenido que buscar en varios sitios para recuperar información que necesitabas?',
    short: 'Buscar en varios sitios la información que necesitaba',
    fact: 'tuviste que buscar en varios sitios para recuperar información que necesitabas',
    theme: 'recuperar información'
  },
  B: {
    q: '…has repetido pasos o introducido la misma información en más de un sitio?',
    short: 'Repetir pasos o introducir los mismos datos en varios sitios',
    fact: 'repetiste pasos o introdujiste la misma información en más de un sitio',
    theme: 'repetir pasos'
  },
  C: {
    q: '…has necesitado varios intercambios de mensajes para coordinar una actividad con otras personas?',
    short: 'Necesitar muchos mensajes para coordinarme con otras personas',
    fact: 'necesitaste varios intercambios de mensajes para coordinar una actividad con otras personas',
    theme: 'coordinarte con otras personas'
  },
  D: {
    q: '…has tenido dificultad para saber qué tenías pendiente o por dónde empezar?',
    short: 'No saber bien qué tenía pendiente o por dónde empezar',
    fact: 'tuviste dificultad para saber qué tenías pendiente o por dónde empezar',
    theme: 'gestionar pendientes'
  },
  E: {
    q: '…has vuelto a revisar información para comparar opciones o tomar una decisión?',
    short: 'Volver a revisar información para comparar o decidir',
    fact: 'volviste a revisar información para comparar opciones o tomar una decisión',
    theme: 'comparar o decidir'
  },
  F: {
    q: '…has querido avanzar en una actividad, pero la has pospuesto o dejado a medias?',
    short: 'Posponer o dejar a medias una actividad en la que quería avanzar',
    fact: 'quisiste avanzar en una actividad, pero la pospusiste o la dejaste a medias',
    theme: 'avanzar en una actividad'
  }
};
DC.SIT_IDS = ['A', 'B', 'C', 'D', 'E', 'F'];

DC.CONTEXTS = [
  { id: 'estudios', label: 'Estudios o formación' },
  { id: 'ajena', label: 'Trabajo por cuenta ajena' },
  { id: 'propio', label: 'Negocio propio o trabajo autónomo' },
  { id: 'empleo', label: 'Búsqueda de empleo' },
  { id: 'hogar', label: 'Hogar o cuidados' },
  { id: 'hobbies', label: 'Hobbies o proyectos personales' },
  { id: 'social', label: 'Actividades sociales o voluntariado' },
  { id: 'descanso', label: 'Descanso y ocio' },
  { id: 'otra', label: 'Otra actividad' }
];

const OTRA_TAREA = { id: 'otra', label: 'Otra tarea', textField: { max: 180, label: 'Describe la tarea (opcional)' } };

DC.TASKS = {
  A: [
    { id: 'archivo', label: 'Encontrar un archivo, una nota o un mensaje' },
    { id: 'reunir', label: 'Reunir información repartida entre varios sitios' },
    { id: 'acuerdo', label: 'Recuperar un acuerdo, una instrucción o una fecha' },
    { id: 'actualizada', label: 'Comprobar qué información estaba actualizada' },
    OTRA_TAREA
  ],
  B: [
    { id: 'mismosdatos', label: 'Introducir los mismos datos en varios sitios' },
    { id: 'mensajes', label: 'Preparar mensajes o documentos parecidos' },
    { id: 'ordenar', label: 'Ordenar o clasificar archivos, fotos o notas' },
    { id: 'calculos', label: 'Hacer cálculos o preparar resúmenes periódicos' },
    OTRA_TAREA
  ],
  C: [
    { id: 'fecha', label: 'Acordar una fecha o un horario' },
    { id: 'repartir', label: 'Repartir tareas o responsabilidades' },
    { id: 'recoger', label: 'Recoger respuestas o confirmar asistencia' },
    { id: 'consultar', label: 'Consultar acuerdos o el estado de una actividad' },
    OTRA_TAREA
  ],
  D: [
    { id: 'fechas', label: 'Recordar fechas o compromisos' },
    { id: 'reunir', label: 'Reunir pendientes de diferentes sitios' },
    { id: 'elegir', label: 'Elegir qué hacer primero' },
    { id: 'dividir', label: 'Dividir una tarea en pasos para empezar' },
    OTRA_TAREA
  ],
  E: [
    { id: 'compras', label: 'Comparar compras o servicios' },
    { id: 'elegir', label: 'Elegir una actividad, formación u oportunidad' },
    { id: 'requisitos', label: 'Comprobar requisitos o compatibilidad' },
    { id: 'organizar', label: 'Organizar información que había guardado' },
    OTRA_TAREA
  ],
  F: [
    { id: 'aprender', label: 'Aprender o practicar algo' },
    { id: 'proyecto', label: 'Crear o desarrollar un proyecto' },
    { id: 'rutina', label: 'Mantener una rutina' },
    { id: 'organizar', label: 'Organizar o participar en una actividad' },
    { id: 'gestion', label: 'Preparar una gestión o un siguiente paso' },
    OTRA_TAREA
  ]
};

/* Para la ruta de actividades deseadas, la actividad elegida
   sugiere la tarea equivalente de la rama F (solo como preselección). */
DC.ALT_TO_TASK = { aprender: 'aprender', hobby: 'proyecto', coordinar: 'organizar', rutina: 'rutina', siguiente: 'gestion', otra: 'otra' };

DC.QUESTIONS = {
  q1: {
    type: 'multi', section: 'Contexto',
    title: '¿A qué has dedicado tiempo durante las últimas dos semanas?',
    options: DC.CONTEXTS
  },

  /* q2A … q2F se generan más abajo a partir de DC.SITUATIONS */

  q3: {
    type: 'multi', section: 'Consecuencias',
    title: '¿Cuáles de estas situaciones te quitaron tiempo que querías dedicar a otra cosa, te dificultaron avanzar o tuvieron alguna consecuencia que te importara?',
    options: function (a, d) {
      return d.occurred.map(function (s) { return { id: s, label: DC.SITUATIONS[s].short }; })
        .concat([
          { id: 'ninguna', label: 'Ninguna tuvo consecuencias relevantes', exclusive: true },
          { id: 'noseguro', label: 'No estoy seguro/a', exclusive: true }
        ]);
    }
  },

  q4: {
    type: 'single', section: 'Elegir una situación',
    title: function (a, d) {
      return d.uncertain ? 'Si quieres, elige una situación para explorarla un poco más' : '¿Cuál prefieres que exploremos un poco más?';
    },
    options: function (a, d) {
      var opts = d.candidates.map(function (s) { return { id: s, label: DC.SITUATIONS[s].short }; });
      if (d.candidates.length > 1) opts.push({ id: 'nopref', label: 'No tengo preferencia' });
      if (d.uncertain) opts.push({ id: 'ninguna', label: 'Prefiero no explorar ninguna de estas' });
      return opts;
    }
  },

  q4b: {
    type: 'single', section: 'Elegir una situación',
    title: 'Varias situaciones ocurren con la misma frecuencia. ¿Cuál exploramos?',
    help: 'No queremos decidir por ti cuál es más importante.',
    options: function (a, d) {
      return d.tied.map(function (s) { return { id: s, label: DC.SITUATIONS[s].short }; });
    }
  },

  qalt: {
    type: 'single', section: 'Algo que quieras hacer',
    title: 'Pensando en el último mes, ¿hay algo que hayas querido hacer y que no hayas podido empezar o mantener?',
    options: [
      { id: 'aprender', label: 'Aprender o practicar algo' },
      { id: 'hobby', label: 'Avanzar en un hobby o proyecto personal' },
      { id: 'coordinar', label: 'Participar en actividades o coordinarme con otras personas' },
      { id: 'rutina', label: 'Mantener una rutina personal' },
      { id: 'siguiente', label: 'Preparar un siguiente paso de estudios o trabajo' },
      { id: 'otra', label: 'Otra actividad' },
      { id: 'nada', label: 'No hay nada que quiera explorar ahora' }
    ]
  },

  q5: {
    type: 'single', section: 'La situación elegida',
    title: '¿En qué ámbito te ocurre principalmente?',
    options: function (a) {
      var sel = (a.q1 && a.q1.v) || [];
      return DC.CONTEXTS.filter(function (c) { return sel.indexOf(c.id) !== -1; })
        .map(function (c) { return { id: c.id, label: c.id === 'otra' ? 'La otra actividad que mencionaste' : c.label }; })
        .concat([
          { id: 'varios', label: 'En varios ámbitos' },
          { id: 'otro', label: 'En otro ámbito' }
        ]);
    }
  },

  q6: {
    type: 'single', section: 'La tarea concreta',
    title: '¿Cuál de estas tareas se parece más a lo que estabas haciendo?',

DC.SIT_IDS.forEach(function (s, i) {
  DC.QUESTIONS['q2' + s] = {
    type: 'single', section: 'Situaciones', sectionStep: (i + 1) + ' de 6',

<script>
/* =====================================================================
   FLUJO Y RAMIFICACIÓN
   ---------------------------------------------------------------------
   derive()  → calcula qué situación se explora y por qué ruta.
   SCREENS   → orden de pantallas y condiciones para mostrarlas.
   sig()     → "firma" de lo que condiciona cada respuesta. Si la firma
               cambia (por ejemplo, cambia la situación explorada), la
               respuesta guardada deja de ser válida y se elimina.
   prune()   → elimina respuestas que ya no aplican.
   CONTRADICTIONS → reglas de respuestas aparentemente contradictorias
               que generan una aclaración opcional antes del informe.
   ===================================================================== */
window.DC = window.DC || {};

DC.val = function (a, q) { return a[q] ? a[q].v : undefined; };
DC.has = function (a, q, id) { var v = DC.val(a, q); return Array.isArray(v) ? v.indexOf(id) !== -1 : v === id; };
DC.hasAny = function (a, q, ids) { return ids.some(function (id) { return DC.has(a, q, id); }); };
DC.text = function (a, q, key) { return (a[q] && a[q].texts && a[q].texts[key]) ? a[q].texts[key] : ''; };

DC.scaleRank = function (v) {
  var o = DC.SCALE.filter(function (s) { return s.id === v; })[0];
  return o && o.rank ? o.rank : 0;
};

/* Ruta: 'pending' (faltan respuestas para decidir), 'alt' (ruta de
   actividades deseadas, a la espera de qalt), 'main' (hay situación
   elegida) o 'none' (no hay nada que explorar). */
DC.derive = function (a) {
  var val = DC.val;
  var d = {
    occurred: [], candidates: [], tied: [], uncertain: false,
    q2done: false, needsQ4: false, needsQ4b: false, altNeeded: false,
    route: 'pending', situation: null, source: null, alt: null
  };
  DC.SIT_IDS.forEach(function (s) { if (DC.scaleRank(val(a, 'q2' + s)) > 0) d.occurred.push(s); });
  d.q2done = DC.SIT_IDS.every(function (s) { return !!val(a, 'q2' + s); });
  if (!d.q2done) return d;

  var goAlt = false;
  if (d.occurred.length === 0) {
    goAlt = true;
    d.altReason = 'sin-situaciones';
  } else {
    var q3 = val(a, 'q3');
    if (!q3) return d;
    if (q3.indexOf('ninguna') !== -1) {
      goAlt = true;
      d.altReason = 'sin-consecuencias';
    } else {
      d.uncertain = q3.indexOf('noseguro') !== -1;
      d.candidates = d.uncertain ? d.occurred.slice() : q3.filter(function (s) { return d.occurred.indexOf(s) !== -1; });
      if (d.candidates.length === 1 && !d.uncertain) {
        d.situation = d.candidates[0]; d.source = 'single';
      } else {
        d.needsQ4 = true;
        var q4 = val(a, 'q4');
        if (!q4) return d;
        if (q4 === 'ninguna') {
          goAlt = true;
          d.altReason = 'no-explorar';
        } else if (q4 === 'nopref') {
          var max = Math.max.apply(null, d.candidates.map(function (s) { return DC.scaleRank(val(a, 'q2' + s)); }));
          d.tied = d.candidates.filter(function (s) { return DC.scaleRank(val(a, 'q2' + s)) === max; });
          if (d.tied.length === 1) {
            d.situation = d.tied[0]; d.source = 'freq';
          } else {
            d.needsQ4b = true;
            var q4b = val(a, 'q4b');
            if (!q4b) return d;
            d.situation = q4b; d.source = 'tiebreak';
          }
        } else {
          d.situation = q4; d.source = 'chosen';
        }
      }
    }
  }

  if (goAlt) {
    d.altNeeded = true;
    d.route = 'alt';
    var qa = val(a, 'qalt');
    if (!qa) return d;
    if (qa === 'nada') { d.route = 'none'; return d; }
    d.situation = 'F'; d.source = 'alt'; d.alt = qa;
  }
  if (d.situation) d.route = 'main';
  return d;
};

function mainOrPending(d) { return d.route === 'main' || d.route === 'pending'; }

DC.SCREENS = [
  { id: 'q1', qs: ['q1'] }
].concat(DC.SIT_IDS.map(function (s) { return { id: 'q2' + s, qs: ['q2' + s] }; })).concat([
  { id: 'q3', qs: ['q3'], show: function (a, d) { return !d.q2done || d.occurred.length > 0; } },
  { id: 'q4', qs: ['q4'], show: function (a, d) { return d.needsQ4; } },
  { id: 'q4b', qs: ['q4b'], show: function (a, d) { return d.needsQ4b; } },
  { id: 'qalt', qs: ['qalt'], show: function (a, d) { return d.altNeeded; } },
  { id: 'q5', qs: ['q5'], show: function (a, d) { return mainOrPending(d); } },
  { id: 'q6', qs: ['q6'], show: function (a, d) { return mainOrPending(d); } },
  { id: 'q7', qs: ['q7'], show: function (a, d) { return mainOrPending(d); } },
  { id: 'q8', qs: ['q8'], show: function (a, d) { return mainOrPending(d); } },
  { id: 'q9', qs: ['q9'], show: function (a, d) { return mainOrPending(d) && !DC.has(a, 'q8', 'nointentado'); } },
  { id: 'q10a', qs: ['q10a'], show: function (a, d) { return mainOrPending(d); } },
  { id: 'q10b', qs: ['q10b'], show: function (a, d) { return mainOrPending(d); } },
  { id: 'q10c', qs: ['q10c'], show: function (a, d) { return d.route === 'main' && DC.has(a, 'q10b', 'tiempo'); } },
  { id: 'q11', qs: ['q11a', 'q11b'], show: function (a, d) { return mainOrPending(d); } },
  { id: 'q12', qs: ['q12'], show: function (a, d) { return mainOrPending(d); } },
  { id: 'qc', qs: ['qc'], optional: true, show: function (a, d) { return d.route === 'main' && DC.contradictions(a, d).length > 0; } },
  { id: 'q13', qs: ['q13'], optional: true, show: function (a, d) { return mainOrPending(d); } }
]);

DC.screenById = function (id) { return DC.SCREENS.filter(function (s) { return s.id === id; })[0]; };
DC.screenOfQuestion = function (q) { return DC.SCREENS.filter(function (s) { return s.qs.indexOf(q) !== -1; })[0]; };

DC.path = function (a, d) {
  d = d || DC.derive(a);
  return DC.SCREENS.filter(function (s) { return !s.show || s.show(a, d); });
};

DC.sig = function (q, a, d) {
  var after = ['q7', 'q8', 'q9', 'q10a', 'q10b', 'q10c', 'q11a', 'q11b', 'q12', 'q13'];
  if (q === 'q3') return d.occurred.join(',');
  if (q === 'q4') return d.candidates.join(',') + '|' + d.uncertain;
  if (q === 'q4b') return d.tied.join(',');
  if (q === 'q5') return d.situation + '|' + ((DC.val(a, 'q1') || []).join(','));
  if (q === 'q6') return String(d.situation);
  if (q === 'qc') return DC.contradictions(a, d).map(function (c) { return c.id; }).join(',');
  if (after.indexOf(q) !== -1) return String(d.situation);
  return '';
};

/* Elimina respuestas fuera de la ruta activa o cuya firma ha cambiado.
   Devuelve la lista de preguntas eliminadas. */
DC.prune = function (a) {
  var removed = [];
  for (var i = 0; i < 12; i++) {
    var d = DC.derive(a);
    var onPath = {};
    DC.path(a, d).forEach(function (s) { s.qs.forEach(function (q) { onPath[q] = true; }); });
    var changed = false;
    Object.keys(a).forEach(function (q) {
      if (!onPath[q] || a[q].sig !== DC.sig(q, a, d)) {
        delete a[q]; removed.push(q); changed = true;
      }
    });
    /* Selecciones de q3 que ya no corresponden a situaciones ocurridas */
    if (!changed) break;
  }
  return removed;
};

DC.commit = function (a, q, value, texts) {
  a[q] = { v: value, texts: texts || {}, sig: '' };
  a[q].sig = DC.sig(q, a, DC.derive(a));
};

DC.optionsFor = function (q, a, d) {
  var def = DC.QUESTIONS[q];
  var o = def.options;
  return typeof o === 'function' ? o(a, d || DC.derive(a)) : (o || []);
};
DC.titleFor = function (q, a, d) {
  var t = DC.QUESTIONS[q].title;
  return typeof t === 'function' ? t(a, d || DC.derive(a)) : t;
};
DC.labelOf = function (q, id, a, d) {
  var o = DC.optionsFor(q, a, d).filter(function (x) { return x.id === id; })[0];
  return o ? o.label : id;
};

DC.isAnswered = function (q, a) {
  var def = DC.QUESTIONS[q];
  if (def.type === 'text' || def.type === 'clarify') return true;
  var v = DC.val(a, q);
  return Array.isArray(v) ? v.length > 0 : !!v;
};

DC.screenDone = function (s, a) {
  return s.optional || s.qs.every(function (q) { return DC.isAnswered(q, a); });
};

DC.isComplete = function (a) {
  var d = DC.derive(a);
  if (d.route === 'none') return true;
  if (d.route !== 'main') return false;
  return DC.path(a, d).every(function (s) { return DC.screenDone(s, a); });
};

/* ---------- Respuestas aparentemente contradictorias ---------- */
var STRONG = ['errores', 'gasto', 'oportunidad', 'impide'];

DC.CONTRADICTIONS = [
  {
    id: 'c_metodo',
    test: function (a) {
      return DC.val(a, 'q9') === 'bien' && (DC.has(a, 'q8', 'pospongo') || DC.hasAny(a, 'q10b', ['errores', 'oportunidad', 'impide']));
    },
    text: function (a, d) {
      var other = DC.has(a, 'q8', 'pospongo')
        ? 'que sueles posponerla o dejarla sin resolver'
        : 'que tiene esta consecuencia: «' + DC.labelOf('q10b', ['errores', 'oportunidad', 'impide'].filter(function (x) { return DC.has(a, 'q10b', x); })[0], a, d) + '»';
      return 'Has indicado que tu forma actual de hacerlo te funciona bien y requiere poco esfuerzo, y también ' + other + '. ¿Qué se acerca más a tu caso?';
    },
    options: [
      { id: 'funciona', label: 'Me funciona bien; lo otro tiene una causa distinta' },
      { id: 'parcial', label: 'Me funciona solo a veces, o con más esfuerzo del que indiqué' },
      { id: 'nodecir', label: 'Prefiero no aclararlo' }
    ]
  },
  {
    id: 'c_consecuencia',
    test: function (a, d) {
      return ['single', 'chosen', 'freq', 'tiebreak'].indexOf(d.source) !== -1 && !d.uncertain && DC.has(a, 'q10b', 'ninguna');
    },
    text: function () {
      return 'Al principio marcaste que esta situación tuvo alguna consecuencia que te importaba, y ahora que no tiene consecuencias relevantes. ¿Qué se acerca más a tu caso?';
    },
    options: [
      { id: 'relevante', label: 'Sí tiene consecuencias, pero no encajaban en la lista' },
      { id: 'norelevante', label: 'En realidad no tiene consecuencias relevantes' },
      { id: 'nodecir', label: 'Prefiero no aclararlo' }
    ]
  },
  {
    id: 'c_cambio',
    test: function (a) { return DC.has(a, 'q12', 'continuar') && DC.hasAny(a, 'q10b', STRONG); },
    text: function (a, d) {
      var c = STRONG.filter(function (x) { return DC.has(a, 'q10b', x); })[0];
      return 'Prefieres continuar como ahora, aunque indicaste esta consecuencia: «' + DC.labelOf('q10b', c, a, d) + '». ¿Qué se acerca más a tu caso?';
    },
    options: [
      { id: 'mantener', label: 'Prefiero mantener mi forma actual igualmente' },
      { id: 'abierto', label: 'Probaría algo si encaja con cómo lo hago' },
      { id: 'nodecir', label: 'Prefiero no aclararlo' }
    ]
  }
];

DC.contradictions = function (a, d) {
  d = d || DC.derive(a);
  return DC.CONTRADICTIONS.filter(function (c) { return c.test(a, d); });
};

DC.clarification = function (a, id) {
  var v = DC.val(a, 'qc');
  return v && v[id] ? v[id] : null;
};

/* ---------- Resumen de respuestas (revisión y exportación) ---------- */
DC.summaryTitle = function (q, a, d) {
  var def = DC.QUESTIONS[q];
  if (def.lead) return def.lead.replace('…', '') + def.title.replace('…', '');
  return DC.titleFor(q, a, d);
};

DC.answerText = function (q, a, d) {
  var def = DC.QUESTIONS[q];
  var ans = a[q];
  if (!ans) return null;
  if (def.type === 'text') return ans.v ? '«' + ans.v + '»' : 'Sin respuesta';
  if (def.type === 'clarify') {
    var parts = DC.contradictions(a, d).map(function (c) {
      var v = ans.v && ans.v[c.id];
      var lbl = v ? c.options.filter(function (o) { return o.id === v; })[0].label : 'Sin respuesta';
      return lbl;
    });
    return parts.join(' · ');
  }
  var ids = Array.isArray(ans.v) ? ans.v : [ans.v];
  var out = ids.map(function (id) {
    var l = DC.labelOf(q, id, a, d);
    var t = ans.texts && ans.texts[id];
    return t ? l + ': «' + t + '»' : l;
  }).join('; ');
  if (def.extraText && ans.texts && ans.texts[def.extraText.key]) out += ' (herramienta: «' + ans.texts[def.extraText.key] + '»)';
  return out;
};

DC.summary = function (a) {
  var d = DC.derive(a);
  var rows = [];
  DC.path(a, d).forEach(function (s) {
    s.qs.forEach(function (q) {
      if (!a[q]) return;
      if (DC.QUESTIONS[q].type === 'text' && !a[q].v) return;
      if (DC.QUESTIONS[q].type === 'clarify') {
        DC.contradictions(a, d).forEach(function (c) {
          var v = a[q].v && a[q].v[c.id];
          if (v) rows.push({ q: q, screen: s.id, title: c.text(a, d), answer: c.options.filter(function (o) { return o.id === v; })[0].label });
        });
        return;
      }
      rows.push({ q: q, screen: s.id, title: DC.summaryTitle(q, a, d), answer: DC.answerText(q, a, d) });
    });
  });
  return rows;
};

</script>
<script>
/* =====================================================================
   GENERACIÓN DEL INFORME (reglas explícitas, sin servicios externos)
   ---------------------------------------------------------------------
   DC.buildReport(answers) → objeto con las seis secciones del informe.
   No usa inteligencia artificial: todo sale de las reglas de abajo.

   Para ampliar en el futuro (p. ej. con un modelo de lenguaje), sustituye
   o complementa DC.buildReport manteniendo la misma forma de objeto:
     { kind, identified:{summary, facts[], inferences[], evidence[]},
       proposal:{text, format, formatNote, limited}, firstVersion[],
       checks[], question, measure[], solidity:{level,label,reason} }

   Dónde tocar:

        : 'Prefieres continuar como ahora. No proponemos ninguna herramienta.';
      r.solidity = s.strong ? 'provisional' : 'none';
      r.reason = s.strong ? 'Hay consecuencias relevantes, pero has indicado que prefieres no cambiar tu forma de hacerlo.' : 'Has indicado que prefieres continuar como ahora.';
      return r;
    }
    /* 4. Falta concreción esencial */
    if (s.taskVague && s.obstacleVague) {
      r.kind = 'moreinfo'; r.format = 'moreinfo';
      r.text = 'Con la información disponible no podemos describir una ayuda concreta sin inventar detalles. Antes conviene conocer mejor la tarea y qué la dificulta.';
      r.solidity = 'provisional'; r.reason = 'No sabemos con precisión ni la tarea ni el obstáculo.';
      return r;
    }
    /* 5. Obstáculos que el software no resuelve */
    if (NONTECH.indexOf(s.obstacle) !== -1) {
      var supported = s.obstacle === 'tiempo' && s.relevant === true && entry && !s.taskVague &&
        ['B', 'A', 'D'].indexOf(sit) !== -1 && !s.noMaintain && !s.works;
      if (supported) {
        r.kind = 'proposal'; r.limited = true;
        r.format = chooseFormat(entry, a, d, s);
        r.text = 'Una herramienta no te dará más tiempo disponible. Como contribución limitada, se podría reducir el tiempo de los pasos de esta tarea con esto: ' + lc(entry.idea);
        r.solidity = 'provisional'; r.reason = 'El freno principal es el tiempo disponible, y no está claro cuánto de él se va en pasos que una herramienta pueda acortar.';
        return r;
      }
      r.kind = 'process'; r.format = 'process';
      if (s.obstacle === 'tiempo') r.text = 'Más que una herramienta, podría ayudar un cambio de proceso: reservar un momento concreto y breve para esta tarea, o reducirla a la parte imprescindible.';
      if (s.obstacle === 'recursos') r.text = 'Una herramienta no resolverá la falta de dinero, materiales u otros recursos. Antes de pensar en tecnología, conviene identificar qué recurso concreto falta y si hay alternativas gratuitas, prestadas o compartidas.';
      if (s.obstacle === 'energia') r.text = 'Una herramienta no aporta energía ni ganas. Puede ayudar un cambio de proceso: reducir el primer paso a algo que cueste pocos minutos y dejarlo preparado de antemano.';
      r.solidity = 'none'; r.reason = 'El obstáculo principal no es algo que una herramienta pueda resolver por sí sola.';
      return r;
    }
    /* 6. Depende de otras personas */
    if (s.obstacle === 'tercero') {
      if (sit === 'C' && entry) {
        r.kind = 'proposal'; r.limited = true;
        r.format = chooseFormat(entry, a, d, s);
        r.text = entry.idea + ' Puede reducir los mensajes necesarios, pero no garantiza que las demás personas respondan.';
        r.solidity = 'provisional'; r.reason = 'El resultado depende de que otras personas usen la misma herramienta.';
        return r;
      }
      r.kind = 'process'; r.format = 'process';
      r.text = 'La tarea depende de la respuesta de otra persona. Puede ayudar más acordar con ella un canal y un plazo de respuesta que añadir una herramienta.';
      r.solidity = 'provisional'; r.reason = 'El obstáculo está en la respuesta de otras personas, no en la herramienta.';
      return r;
    }
    /* 7. Sin obstáculo concreto pero con consecuencias */
    if (s.obstacle === 'ninguno') {
      r.kind = 'moreinfo'; r.format = 'moreinfo';
      r.text = 'Has señalado consecuencias, pero ningún obstáculo concreto. Sin saber qué paso cuesta, no proponemos una herramienta todavía.';
      r.solidity = 'provisional'; r.reason = 'Falta saber en qué paso de la tarea está la dificultad.';
      return r;
    }
    /* 8. Propuesta tecnológica */
    r.kind = 'proposal';
    r.format = chooseFormat(entry, a, d, s);
    r.text = entry.idea;
    if (r.format === 'process') r.text += ' Para no añadir otra herramienta que mantener, se plantearía como una forma de organizarlo dentro de lo que ya usas.';
    if (r.format === 'existing' && s.obstacle !== 'herramienta') r.text += ' Ya existen herramientas habituales que hacen algo parecido; conviene probar alguna antes de construir nada.';
    if (r.format === 'existing' && s.obstacle === 'herramienta') r.text += ' Como la herramienta actual es parte del problema, el primer paso sería comprobar si permite hacerlo de otra forma o si otra existente lo resuelve.';

    var missing = [];
    if (s.taskVague) missing.push('la tarea concreta');
    if (s.obstacleVague) missing.push('qué dificulta la tarea');
    if (s.relevant !== true) missing.push('qué consecuencia tiene');
    if (s.works) missing.push('por qué cambiar un método que funciona');
    if (s.noMaintain || val(a, 'q11b') === 'probar') missing.push('si estarías dispuesto/a a mantenerla');
    if (s.dataUnknown || s.dataThird) missing.push('dónde está la información necesaria');
    if (s.unresolved.length) missing.push('una aparente contradicción en tus respuestas');
    if (d.uncertain) missing.push('si esta situación es realmente la que más te importa');
    if (val(a, 'q10a') === 'nolose') missing.push('con qué frecuencia ocurre');
    if (missing.length === 0) {
      r.solidity = 'ok';
      r.reason = 'La tarea, el obstáculo, sus consecuencias y la disposición a mantener la ayuda están definidos.';
    } else {
      r.solidity = 'provisional';
      r.reason = 'Falta confirmar ' + missing.slice(0, 2).join(' y ') + '.';
    }
    return r;
  }

  function formatNote(r, s) {
    if (r.format === 'none' || !r.format) return '';
    if (r.solidity === 'ok' && !s.integration) return 'Es el formato que mejor encaja con tus respuestas, aunque se confirmaría con la primera prueba.';
    return 'Formato orientativo: no es definitivo mientras falten los datos indicados en «Qué necesitamos comprobar».';
  }

  function firstVersion(r, a, d, s) {
    if (r.kind !== 'proposal' || !r.entry) return [];
    var feats = r.entry.features.slice(0, 3).map(function (f) { return { text: f[0], why: featureWhy(f[1], a, d) }; });
    return feats;
  }

  function checks(r, a, d, s) {
    var c = [];
    if (s.integration && r.kind === 'proposal') c.push('Acceso a datos e integraciones: comprobar si se puede acceder a la información donde está ahora. No damos por hecho que se pueda conectar con otras aplicaciones.');
    if (s.dataThird) c.push('Acceso a datos: la información la tiene otra persona u organización; habría que confirmar si es posible y adecuado usarla.');
    if (s.dataUnknown) c.push('Dónde está la información necesaria para la tarea.');
    if (s.obstacleVague || NONTECH.indexOf(s.obstacle) !== -1 || s.obstacle === 'ninguno') c.push('Causa del problema: qué paso concreto de la tarea genera la dificultad.');
    if (val(a, 'q11b') === 'probar' || s.noMaintain) c.push('Disposición a mantener la herramienta: probarla una o dos semanas antes de decidir.');
    if (s.taskVague) c.push('Precisión de la tarea: no sabemos con detalle en qué consiste.');
    if (s.notTried) c.push('No hay datos sobre una solución actual, porque todavía no has intentado resolverla.');
    if (d.uncertain) c.push('No estabas seguro/a de que esta situación tuviera consecuencias relevantes.');
    if (s.unresolved.length) c.push('Hay respuestas que parecen contradictorias y no se han aclarado.');
    if (has(a, 'q12', 'ejemplo')) c.push('Indicaste que necesitarías ver un ejemplo antes de usarla.');
    if (val(a, 'q10c') === 'varia' || val(a, 'q10c') === 'nolose') c.push('El tiempo que se va en los pasos difíciles no está claro.');
    return c;
  }

  function oneQuestion(r, a, d, s) {
    if (r.kind === 'keep' && !s.strong) return null;
    if (s.taskVague) return '¿Qué intentabas hacer exactamente la última vez que te ocurrió?';
    if (s.obstacleVague || s.obstacle === 'ninguno') return 'La última vez que ocurrió, ¿en qué paso concreto te quedaste parado/a o perdiste más tiempo?';
    if (s.dataUnknown) return '¿Dónde guardas ahora la información que usas para esta tarea?';
    if (s.relevant === null) return '¿Qué pasa cuando esta tarea sale mal o tarda más de la cuenta?';
    if (s.unresolved.length) return 'La forma en que lo haces ahora, ¿te resuelve la tarea por completo o solo en parte?';
    if (s.integration && r.kind === 'proposal') return '¿Qué aplicación o archivo concreto tendría que consultar la ayuda para servirte?';
    if (s.keepAsIs && s.strong) return '¿Qué parte de la tarea provoca la consecuencia que señalaste?';
    return null;
  }

  function measures(r, a, d, s) {
    if (r.kind === 'keep' && r.format === 'none') return [];
    var m = [];
    if (r.kind === 'process') {
      m.push('Después del cambio, anota durante dos semanas si consigues hacer la tarea cuando lo tenías previsto.');
    } else {
      m.push(MEASURES[d.situation]);
    }
    if (has(a, 'q10b', 'errores')) m.push('Anota cuántas veces tienes que rehacer algo, antes y durante la prueba.');
    if (has(a, 'q10b', 'tiempo')) m.push('Si quieres medir tiempo, anótalo en algunas ocasiones antes y durante la prueba. No damos por hecho un ahorro concreto.');
    return m.slice(0, 3);
  }

  function evidence(f, s) {
    var order = ['situation', 'task', 'obstacle', 'method', 'consequence', 'frequency', 'data'];
    return order.filter(function (k) { return f[k]; }).map(function (k) { return f[k]; }).slice(0, 5);
  }

  function inferences(r, a, d, s) {
    var out = [];
    if (s.obstacle && OBSTACLE_INFER[s.obstacle]) out.push(OBSTACLE_INFER[s.obstacle]);
    if (s.works) out.push('Esto sugiere que tu forma actual ya cumple buena parte de su función.');
    else if (['esfuerzo', 'parte', 'noterminar'].indexOf(val(a, 'q9')) !== -1) out.push('Esto sugiere que tu forma actual cumple solo en parte o con un esfuerzo que quisieras reducir.');
    if (s.notTried) out.push('No hay información sobre cómo funcionaría una solución, porque todavía no has intentado resolverla.');
    if (d.uncertain) out.push('No estabas seguro/a de que esta situación tuviera consecuencias, así que esta interpretación es más tentativa.');
    if (d.source === 'freq') out.push('Exploramos esta situación porque indicaste que era la más frecuente; eso no significa que sea la más importante.');
    s.unresolved.forEach(function (c) { out.push('Algunas respuestas parecen contradictorias y no se han aclarado, por lo que no las hemos corregido ni elegido entre ellas.'); });
    return out.filter(function (x, i, arr) { return arr.indexOf(x) === i; });
  }

  function summaryText(a, d, s) {
    var parts = [];
    if (d.source === 'alt') parts.push('Querías ' + ALT_PHRASE[d.alt] + ' y no has podido empezar o mantenerlo.');
    else parts.push('La situación explorada es ' + DC.SITUATIONS[d.situation].theme + '.');
    if (s.task) parts.push('La tarea: ' + (s.task === 'otra' ? (text(a, 'q6', 'otra') ? quote(text(a, 'q6', 'otra')) : 'una tarea distinta de las propuestas') : lc(L('q6', s.task, a, d))) + '.');
    if (s.obstacle) parts.push('El obstáculo principal: ' + (s.obstacle === 'otro' && text(a, 'q7', 'otro') ? quote(text(a, 'q7', 'otro')) : lc(L('q7', s.obstacle, a, d))) + '.');
    if (val(a, 'q8')) parts.push(s.notTried ? 'Todavía no has intentado resolverla.' : 'Ahora la resuelves: ' + list('q8', a, d) + '.');
    return parts.join(' ');
  }

  /* ---------- Informe cuando no hay nada que explorar ---------- */
  function noneReport(a, d) {
    var facts = [];
    if (d.altReason === 'sin-situaciones') facts.push('Has indicado que en las últimas dos semanas no te ocurrió ninguna de las situaciones exploradas, o que no te aplicaban.');
    if (d.altReason === 'sin-consecuencias') facts.push('Has indicado que las situaciones que te ocurrieron no tuvieron consecuencias relevantes.');
    if (d.altReason === 'no-explorar') facts.push('Has preferido no explorar ninguna de las situaciones que te ocurrieron.');
    facts.push('Has indicado que, pensando en el último mes, no hay nada que quieras explorar ahora.');
    return {
      kind: 'none',
      identified: {
        summary: 'No se ha identificado una dificultad concreta ni una actividad que quieras impulsar ahora.',
        facts: facts, evidence: facts,
        inferences: ['Esto sugiere que, por ahora, no hay una situación que justifique una ayuda tecnológica.']
      },
      proposal: { text: 'No proponemos ninguna herramienta. No tiene sentido diseñar una ayuda sin una necesidad concreta.', format: FORMATS.none, formatNote: '', limited: false },
      firstVersion: [],
      checks: ['Si más adelante aparece una tarea que te quite tiempo o te impida avanzar, puedes repetir el cuestionario pensando en ella.'],
      question: null,
      measure: [],
      solidity: { level: 'none', label: SOLIDITY.none, reason: 'Tus respuestas no señalan ninguna dificultad ni actividad que explorar.' }
    };
  }

  DC.buildReport = function (a) {
    var d = DC.derive(a);
    if (d.route === 'none') return noneReport(a, d);
    var s = signals(a, d);
    var f = facts(a, d);
    var r = decide(a, d, s);
    return {
      kind: r.kind,
      situation: d.situation,
      identified: {
        summary: summaryText(a, d, s),
        facts: f,
        evidence: evidence(f, s),
        inferences: inferences(r, a, d, s)
      },
      proposal: {
        text: r.text,
        format: FORMATS[r.format] || FORMATS.none,
        formatNote: formatNote(r, s),
        limited: r.limited
      },
      firstVersion: firstVersion(r, a, d, s),
      checks: checks(r, a, d, s),
      question: oneQuestion(r, a, d, s),
      measure: measures(r, a, d, s),
      solidity: { level: r.solidity, label: SOLIDITY[r.solidity], reason: r.reason }
    };
  };

  DC.FORMATS = FORMATS;
  DC.SOLIDITY = SOLIDITY;
})();

</script>
<script>
/* =====================================================================
   INTERFAZ
   Las respuestas solo viven en la memoria de esta página: no se envían
   a ningún servidor ni se guardan en el navegador. Al cerrar o recargar
   la página se pierden, salvo que la persona descargue el informe.
   ===================================================================== */
(function () {
  var S = {
    answers: {}, mode: 'intro', screen: null, draft: {},
    notice: null, fromReview: false, confirmReset: false, actionMsg: '', errors: {}
  };
  var app = document.getElementById('app');
  var live = document.getElementById('live');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function announce(msg) { live.textContent = ''; setTimeout(function () { live.textContent = msg; }, 30); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  /* ---------- Navegación ---------- */
  var ORDER = DC.SCREENS.map(function (s) { return s.id; });
  function gi(id) { return ORDER.indexOf(id); }

  function nextScreen(fromId) {
    var path = DC.path(S.answers);
    var g = gi(fromId);
    var nx = path.filter(function (s) { return gi(s.id) > g; })[0];
    return nx ? nx.id : null;
  }
  function prevScreen(fromId) {
    var path = DC.path(S.answers);
    var g = gi(fromId);
    var pv = path.filter(function (s) { return gi(s.id) < g; });
    return pv.length ? pv[pv.length - 1].id : null;
  }
  function firstIncomplete() {
    var p = DC.path(S.answers).filter(function (s) { return !DC.screenDone(s, S.answers); })[0];
    return p ? p.id : null;
  }

  function goScreen(id, opts) {
    S.mode = 'q'; S.screen = id; S.errors = {};
    var scr = DC.screenById(id);
    S.draft = {};
    scr.qs.forEach(function (q) {
      S.draft[q] = S.answers[q] ? { v: clone(S.answers[q].v), texts: clone(S.answers[q].texts || {}) } : emptyDraft(q);
    });
    /* Ruta de actividades: preselecciona la tarea equivalente (se puede cambiar) */
    if (id === 'q6' && !S.answers.q6) {
      var d = DC.derive(S.answers);
      if (d.source === 'alt' && DC.ALT_TO_TASK[d.alt] && DC.ALT_TO_TASK[d.alt] !== 'otra') S.draft.q6.v = DC.ALT_TO_TASK[d.alt];
    }
    render(opts && opts.focus);
  }

  function emptyDraft(q) {
    var t = DC.QUESTIONS[q].type;
    if (t === 'multi') return { v: [], texts: {} };
    if (t === 'clarify') return { v: {}, texts: {} };
    if (t === 'text') return { v: '', texts: {} };
    return { v: null, texts: {} };
  }

  function commitDraft() {
    var scr = DC.screenById(S.screen);
    var before = Object.keys(S.answers).length;
    scr.qs.forEach(function (q) {
      var dr = S.draft[q]; if (!dr) return;
      var t = DC.QUESTIONS[q].type;
      var empty = t === 'multi' ? !dr.v.length : (t === 'single' ? !dr.v : false);
      if (t === 'text') dr.v = (dr.v || '').trim();
      Object.keys(dr.texts).forEach(function (k) { dr.texts[k] = (dr.texts[k] || '').trim(); if (!dr.texts[k]) delete dr.texts[k]; });
      if (empty) delete S.answers[q];
      else DC.commit(S.answers, q, dr.v, dr.texts);
    });
    var removed = DC.prune(S.answers).filter(function (q) { return scr.qs.indexOf(q) === -1; });
    if (removed.length) {
      S.notice = removed.length === 1
        ? 'Hemos quitado 1 respuesta posterior que ya no aplica tras tu cambio.'
        : 'Hemos quitado ' + removed.length + ' respuestas posteriores que ya no aplican tras tu cambio.';
    }
    return before;
  }

  function validate() {
    var scr = DC.screenById(S.screen);
    S.errors = {};
    scr.qs.forEach(function (q) {
      var t = DC.QUESTIONS[q].type;
      if (t === 'text' || t === 'clarify') return;
      var v = S.draft[q].v;
      if (Array.isArray(v) ? !v.length : !v) S.errors[q] = t === 'multi' ? 'Marca al menos una opción para continuar.' : 'Elige una opción para continuar.';
    });
    return Object.keys(S.errors).length === 0;
  }

  function onContinue() {
    if (!validate()) {
      render();
      var q = Object.keys(S.errors)[0];
      var first = app.querySelector('[data-q="' + q + '"] input');
      if (first) first.focus();
      announce('Falta una respuesta. ' + S.errors[q]);
      return;
    }
    var cur = S.screen;
    S.notice = null;
    commitDraft();
    var nx = nextScreen(cur);
    if (S.fromReview && DC.isComplete(S.answers) && !nx) { showReport(); return; }
    if (nx) goScreen(nx, { focus: true });
    else if (DC.isComplete(S.answers)) showReport();
    else { var fi = firstIncomplete(); if (fi) goScreen(fi, { focus: true }); }
  }

  function onBack() {
    var cur = S.screen;
    commitDraft();
    var pv = prevScreen(cur);
    if (pv) goScreen(pv, { focus: true });
    else { S.mode = 'intro'; render(true); }
  }

  function showReport() {
    S.mode = 'report'; S.fromReview = false; S.confirmReset = false; S.actionMsg = ''; S.notice = null;
    render(true);
  }

  /* ---------- Edición del borrador ---------- */
  function onChoice(q, optId, checked) {
    var def = DC.QUESTIONS[q];
    var dr = S.draft[q];
    if (def.type === 'single' || def.type === 'clarifyItem') {
      Object.keys(dr.texts).forEach(function (k) { if (k !== optId && k !== 'tool') delete dr.texts[k]; });
      dr.v = optId;
    } else {
      var opts = DC.optionsFor(q, S.answers);
      var opt = opts.filter(function (o) { return o.id === optId; })[0];
      if (checked) {
        if (opt && opt.exclusive) {
          var dropped = dr.v.filter(function (x) { return x !== optId; });
          dr.v = [optId];
          if (dropped.length) announce('Se han desmarcado las demás opciones porque «' + opt.label + '» es incompatible con ellas.');
        } else {
          var ex = dr.v.filter(function (x) { var o = opts.filter(function (oo) { return oo.id === x; })[0]; return o && o.exclusive; });
          if (ex.length) announce('Se ha desmarcado «' + DC.labelOf(q, ex[0], S.answers) + '».');
          dr.v = dr.v.filter(function (x) { return ex.indexOf(x) === -1; });
          if (!def.max || dr.v.length < def.max) dr.v.push(optId);
        }
      } else {
        dr.v = dr.v.filter(function (x) { return x !== optId; });
      }
      Object.keys(dr.texts).forEach(function (k) { if (k !== def.extraText?.key && dr.v.indexOf(k) === -1) delete dr.texts[k]; });
      if (def.extraText && def.extraText.hideIf && def.extraText.hideIf.some(function (h) { return dr.v.indexOf(h) !== -1; })) delete dr.texts[def.extraText.key];
      if (def.max && dr.v.length >= def.max && checked) announce('Has elegido el máximo de ' + def.max + ' opciones. Desmarca una para cambiarla.');
    }
    delete S.errors[q];
    render(false, 'opt-' + q + '-' + optId);
  }

  /* ---------- Render ---------- */
  function setProgress() {
    var box = document.getElementById('progress');
    if (S.mode !== 'q') { box.hidden = true; return; }
    box.hidden = false;
    var d = DC.derive(S.answers);
    var path = DC.path(S.answers, d);
    var idx = path.map(function (s) { return s.id; }).indexOf(S.screen);
    var pos = idx + 1, total = path.length;
    var pct = Math.round((pos - 1) / total * 100);
    document.getElementById('progress-text').textContent = 'Pantalla ' + pos + ' de ' + total + (d.route === 'pending' ? ' (aproximado: depende de tus respuestas)' : '');
    var bar = document.getElementById('progress-bar');
    bar.setAttribute('aria-valuenow', pct);
    document.getElementById('progress-fill').style.width = pct + '%';
  }

  function render(focusHeading, focusId) {
    setProgress();
    if (S.mode === 'intro') app.innerHTML = introHTML();
    else if (S.mode === 'q') app.innerHTML = screenHTML();
    else if (S.mode === 'report') app.innerHTML = reportScreenHTML();
    else if (S.mode === 'review') app.innerHTML = reviewHTML();
    bind();
    if (focusId) { var el = document.getElementById(focusId); if (el) el.focus(); }
    else if (focusHeading) {
      var h = app.querySelector('h1');
      if (h) { h.setAttribute('tabindex', '-1'); h.focus(); }
      window.scrollTo(0, 0);
    }
  }

  function introHTML() {
    return '<div class="intro">' +
      '<h1>Descubre qué podría facilitar tu día a día</h1>' +
      '<p>Responde unas preguntas sobre cómo haces algunas cosas cotidianas. Al terminar verás una propuesta orientativa de ayuda, basada en tus respuestas. No necesitas saber de tecnología ni tener una idea de aplicación.</p>' +
      '<p class="note">Piensa en las últimas dos semanas, salvo que indiquemos otra cosa. No incluyas información privada en los campos opcionales.</p>' +
      '<ul class="facts"><li>Duración prevista: 5–10 minutos</li><li>Ningún campo de texto es obligatorio</li><li>Tus respuestas no salen de esta página</li></ul>' +
      '<button type="button" class="btn-primary" data-act="start">Empezar</button>' +
      '<p class="disclaimer">Es un cuestionario exploratorio, no un diagnóstico ni un instrumento validado científicamente.</p>' +
      '</div>';
  }

  function hintFor(def) {
    if (def.type === 'single') return '<span aria-hidden="true">◯</span> <span><b>Elige una opción</b></span>';
    if (def.type === 'multi') return '<span aria-hidden="true">☐</span> <span><b>' + (def.max ? 'Puedes elegir hasta ' + def.max : 'Puedes elegir varias') + '</b></span>';
    return '<span><b>Opcional</b></span>';
  }

  function optionHTML(q, def, o, dr, name, disabledFull) {
    var multi = def.type === 'multi';
    var checked = multi ? dr.v.indexOf(o.id) !== -1 : dr.v === o.id;
    var disabled = multi && !checked && disabledFull && !o.exclusive;
    var id = 'opt-' + name + '-' + o.id;
    var h = '<label class="opt ' + (multi ? 'check' : 'radio') + '" for="' + id + '">' +
      '<input type="' + (multi ? 'checkbox' : 'radio') + '" id="' + id + '" name="' + esc(name) + '" value="' + esc(o.id) + '"' +
      (checked ? ' checked' : '') + (disabled ? ' disabled aria-disabled="true"' : '') +
      ' data-q="' + q + '" data-opt="' + esc(o.id) + '"' + '>' +
      '<span class="mark" aria-hidden="true"></span>' +
      '<span class="lbl">' + esc(o.label) + (o.exclusive && multi ? '<span class="tag">Si la marcas, se desmarcan las demás</span>' : '') + '</span>' +
      (checked ? '<span class="sel-state" aria-hidden="true">Elegida</span>' : '') +
      '</label>';
    if (o.textField && checked) {
      var tv = dr.texts[o.id] || '';
      var tid = 'txt-' + q + '-' + o.id;
      h += '<div class="textfield inline"><label for="' + tid + '">' + esc(o.textField.label) + '</label>' +
        '<input type="text" id="' + tid + '" maxlength="' + o.textField.max + '" value="' + esc(tv) + '" data-text="' + q + '" data-key="' + o.id + '" aria-describedby="' + tid + '-c">' +
        '<span class="counter" id="' + tid + '-c">' + tv.length + ' / ' + o.textField.max + ' caracteres</span></div>';
    }
    return h;
  }

  function questionBlock(q, single) {
    var def = DC.QUESTIONS[q];
    var d = DC.derive(S.answers);
    var dr = S.draft[q];
    var title = DC.titleFor(q, S.answers, d);
    var hid = 'h-' + q, hintId = 'hint-' + q, errId = 'err-' + q;
    var h = '';
    var err = S.errors[q];
    if (def.type === 'text') {
      var tid = 'txt-' + q;
      h += single ? '<h1 id="' + hid + '">' + esc(title) + '</h1>' : '<h2>' + esc(title) + '</h2>';
      h += '<div class="textfield"><label for="' + tid + '">' + esc(def.help || 'Opcional') + '</label>' +
        '<textarea id="' + tid + '" maxlength="' + def.max + '" data-text="' + q + '" data-key="__v" aria-describedby="' + tid + '-c">' + esc(dr.v || '') + '</textarea>' +
        '<span class="counter" id="' + tid + '-c">' + (dr.v || '').length + ' / ' + def.max + ' caracteres</span></div>';
      return h;
    }
    var opts = DC.optionsFor(q, S.answers, d);
    var full = def.max && dr.v.length >= def.max;
    if (single) {
      if (def.lead) h += '<p class="lead">' + esc(def.lead) + '</p>';
      h += '<h1 id="' + hid + '">' + esc(title) + '</h1>';
    }
    h += '<fieldset data-q="' + q + '" aria-describedby="' + hintId + (err ? ' ' + errId : '') + '"' + (err ? ' aria-invalid="true"' : '') + (single ? ' aria-labelledby="' + hid + '"' : '') + '>';
    if (!single) h += '<legend class="subq">' + esc(title) + '</legend>';
    h += '<p class="hint" id="' + hintId + '">' + hintFor(def) + (full ? ' <span>· Has llegado al máximo; desmarca una para cambiarla.</span>' : '') + '</p>';
    if (def.help) h += '<p class="muted">' + esc(def.help) + '</p>';
    h += '<div class="opts' + (def.compact ? ' compact' : '') + '">';
    opts.forEach(function (o) { h += optionHTML(q, def, o, dr, q, full); });
    h += '</div>';
    if (def.extraText) {
      var hide = def.extraText.hideIf.some(function (x) { return dr.v.indexOf(x) !== -1; });
      if (!hide) {
        var eid = 'txt-' + q + '-' + def.extraText.key, ev = dr.texts[def.extraText.key] || '';
        h += '<div class="textfield" style="margin-top:16px"><label for="' + eid + '">' + esc(def.extraText.label) + '</label>' +
          '<input type="text" id="' + eid + '" maxlength="' + def.extraText.max + '" value="' + esc(ev) + '" data-text="' + q + '" data-key="' + def.extraText.key + '" aria-describedby="' + eid + '-c">' +
          '<span class="counter" id="' + eid + '-c">' + ev.length + ' / ' + def.extraText.max + ' caracteres</span></div>';
      }
    }
    h += '<p class="error" id="' + errId + '"' + (err ? '' : ' hidden') + '><span aria-hidden="true">⚠</span> <span>Falta una respuesta: ' + esc(err || '') + '</span></p>';
    h += '</fieldset>';
    return h;
  }

  function clarifyBlock() {
    var d = DC.derive(S.answers);
    var dr = S.draft.qc;
    var h = '<h1>Antes del informe, una aclaración opcional</h1>' +
      '<p class="muted">Algunas respuestas parecen no encajar entre sí. No las vamos a corregir por ti: puedes aclararlo o seguir sin responder.</p>';
    DC.contradictions(S.answers, d).forEach(function (c) {
      var name = 'qc-' + c.id;
      h += '<fieldset data-q="qc"><legend class="subq">' + esc(c.text(S.answers, d)) + '</legend>' +
        '<p class="hint">' + hintFor({ type: 'single' }) + ' <span>(opcional)</span></p><div class="opts">';
      c.options.forEach(function (o) {
        var id = 'opt-' + name + '-' + o.id;
        var checked = dr.v[c.id] === o.id;
        h += '<label class="opt radio" for="' + id + '"><input type="radio" id="' + id + '" name="' + name + '" data-clar="' + c.id + '" value="' + o.id + '"' + (checked ? ' checked' : '') + '>' +
          '<span class="mark" aria-hidden="true"></span><span class="lbl">' + esc(o.label) + '</span>' + (checked ? '<span class="sel-state" aria-hidden="true">Elegida</span>' : '') + '</label>';
      });
      h += '</div></fieldset>';
    });
    return h;
  }

  function contextLine(d) {
    if (['q6', 'q7', 'q8', 'q9', 'q10a', 'q10b', 'q10c', 'q11', 'q12', 'q13', 'q5'].indexOf(S.screen) === -1 || !d.situation) return '';
    var about;
    if (S.answers.q6 && S.screen !== 'q6' && S.screen !== 'q5') {
      var t = S.answers.q6.v;
      about = 'Sobre la tarea: ' + (t === 'otra' ? (DC.text(S.answers, 'q6', 'otra') || 'otra tarea') : DC.labelOf('q6', t, S.answers, d).toLowerCase());
    } else {
      about = 'Sobre: ' + (d.source === 'alt' ? DC.labelOf('qalt', d.alt, S.answers, d).toLowerCase() : DC.SITUATIONS[d.situation].short.toLowerCase());
    }
    return '<p class="muted" style="margin:0 0 6px;font-size:.92rem">' + esc(about) + '</p>';
  }

  function screenHTML() {
    var scr = DC.screenById(S.screen);
    var d = DC.derive(S.answers);
    var first = scr.qs[0], def = DC.QUESTIONS[first];
    var h = '<form id="qform" novalidate>';
    h += '<p class="eyebrow">' + esc(def.section) + (def.sectionStep ? ' · ' + esc(def.sectionStep) : '') + '</p>';
    if (S.notice) h += '<div class="notice" role="status"><strong>Aviso:</strong> <span>' + esc(S.notice) + '</span></div>';
    if (S.screen === 'q5' && d.source === 'freq') {
      h += '<div class="notice"><span>Vamos a explorar «' + esc(DC.SITUATIONS[d.situation].short) + '» porque has indicado que ocurre con más frecuencia. Puedes cambiarla.</span> ' +
        '<button type="button" class="btn-link" data-act="change-sit">Cambiar la situación</button></div>';
    }
    h += contextLine(d);
    if (def.type === 'clarify') h += clarifyBlock();
    else if (scr.qs.length === 1) h += questionBlock(first, true);
    else {
      h += '<h1>' + esc(def.section) + '</h1><p class="muted">Dos preguntas breves.</p>';
      scr.qs.forEach(function (q) { h += questionBlock(q, false); });
    }
    var isLast = !nextScreen(S.screen);
    h += '<div class="nav"><button type="button" class="btn-ghost" data-act="back">Atrás</button><div class="right">';
    if (S.fromReview && DC.isComplete(S.answers) && !isLast) h += '<button type="button" class="btn-ghost" data-act="toreport">Volver al informe</button>';
    h += '<button type="submit" class="btn-primary">' + (isLast ? 'Ver informe' : 'Continuar') + '</button></div></div></form>';
    return h;
  }

  /* ---------- Informe ---------- */
  var SYM = { ok: 'Suficiente', provisional: 'Provisional', none: 'Sin oportunidad clara' };

  function reportBody(rep, opts) {
    opts = opts || {};
    var h = '';
    var I = rep.identified;
    h += '<section><h2><span class="secnum">1</span>Lo que hemos identificado</h2>';
    h += '<p>' + esc(I.summary) + '</p>';
    if (I.evidence.length) {
      h += '<h3>Respuestas que respaldan la interpretación</h3><span class="label-said">Has indicado</span><ul>';
      I.evidence.forEach(function (e) { h += '<li>' + esc(e) + '</li>'; });
      h += '</ul>';
    }
    if (I.inferences.length) {
      h += '<span class="label-infer">Esto sugiere</span><ul>';
      I.inferences.forEach(function (e) { h += '<li>' + esc(e) + '</li>'; });
      h += '</ul>';
    }
    h += '</section>';

    h += '<section><h2><span class="secnum">2</span>Una posible ayuda</h2><div class="proposal"><p>' + esc(rep.proposal.text) + '</p></div>';
    h += '<dl class="kv"><dt>Formato más adecuado</dt><dd>' + esc(rep.proposal.format) + '</dd></dl>';
    if (rep.proposal.formatNote) h += '<p class="muted" style="margin-top:8px">' + esc(rep.proposal.formatNote) + '</p>';
    h += '</section>';

    h += '<section><h2><span class="secnum">3</span>Primera versión que merecería probarse</h2>';
    if (rep.firstVersion.length) {
      h += '<ol class="features">';
      rep.firstVersion.forEach(function (f) { h += '<li><span>' + esc(f.text) + '</span><span class="why">' + esc(f.why) + '</span></li>'; });
      h += '</ol><p class="muted">Sin cuentas, avisos, chats ni integraciones mientras no haya una necesidad concreta que los justifique.</p>';
    } else h += '<p>No aplica: no proponemos construir una herramienta.</p>';
    h += '</section>';

    h += '<section><h2><span class="secnum">4</span>Qué necesitamos comprobar</h2>';
    if (rep.checks.length) { h += '<ul>'; rep.checks.forEach(function (c) { h += '<li>' + esc(c) + '</li>'; }); h += '</ul>'; }
    else h += '<p>No hay puntos esenciales pendientes para una primera prueba.</p>';
    if (rep.question) h += '<p class="ask">Pregunta que lo aclararía: ' + esc(rep.question) + '</p>';
    h += '</section>';

    h += '<section><h2><span class="secnum">5</span>Cómo sabríamos si ayuda</h2>';
    if (rep.measure.length) { h += '<ul>'; rep.measure.forEach(function (m) { h += '<li>' + esc(m) + '</li>'; }); h += '</ul>'; }
    else h += '<p>No aplica mientras no haya una propuesta que probar.</p>';
    h += '</section>';

    h += '<section><h2><span class="secnum">6</span>Solidez de la propuesta</h2>' +
      '<div class="solidity ' + rep.solidity.level + '"><span class="sym">' + SYM[rep.solidity.level] + '</span><div><p style="margin:0 0 4px"><strong>' + esc(rep.solidity.label) + '.</strong></p><p style="margin:0">' + esc(rep.solidity.reason) + '</p></div></div>';
    h += '<p class="disclaimer">Informe orientativo generado con reglas fijas a partir de tus respuestas, sin inteligencia artificial. El cuestionario es exploratorio: no es un diagnóstico ni un instrumento validado.</p></section>';

    if (opts.withAnswers) {
      h += '<section><h2>Tus respuestas</h2><ul class="answers">';
      DC.summary(S.answers).forEach(function (r) { h += '<li><span class="q">' + esc(r.title) + '</span><br><strong>' + esc(r.answer) + '</strong></li>'; });
      h += '</ul></section>';
    }
    return h;
  }

  function reportScreenHTML() {
    var rep = DC.buildReport(S.answers);
    var h = '<div class="report"><p class="eyebrow">Informe orientativo</p><h1>Tu propuesta de ayuda</h1>';
    h += '<div class="actions">' +
      '<button type="button" class="btn-ghost" data-act="review">Revisar mis respuestas</button>' +
      '<button type="button" class="btn-ghost" data-act="download">Descargar informe</button>' +
      '<button type="button" class="btn-ghost" data-act="print">Imprimir / guardar como PDF</button>' +
      '<button type="button" class="btn-ghost" data-act="reset">Empezar de nuevo</button></div>';
    if (S.actionMsg) h += '<p class="actions-msg" role="status">' + esc(S.actionMsg) + '</p>';
    if (S.confirmReset) h += '<div class="confirm" role="alert"><span>¿Empezar de nuevo? Se borrarán todas tus respuestas de esta página.</span>' +
      '<button type="button" class="btn-primary" data-act="reset-yes">Sí, borrar y empezar</button><button type="button" class="btn-ghost" data-act="reset-no">Cancelar</button></div>';
    h += reportBody(rep) + '</div>';
    return h;
  }

  function reviewHTML() {
    var rows = DC.summary(S.answers);
    var h = '<p class="eyebrow">Tus respuestas</p><h1>Revisar mis respuestas</h1>' +
      '<p class="muted">Si cambias una respuesta que decide qué se explora, las respuestas posteriores que ya no apliquen se eliminarán.</p><ul class="review-list">';
    rows.forEach(function (r) {
      h += '<li><span class="q">' + esc(r.title) + '</span><button type="button" class="btn-link" data-goto="' + r.screen + '" aria-label="Cambiar: ' + esc(r.title) + '">Cambiar</button><span class="a">' + esc(r.answer) + '</span></li>';
    });
    h += '</ul><button type="button" class="btn-primary" data-act="toreport">Volver al informe</button>';
    return h;
  }

  /* ---------- Exportación ---------- */
  function today() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

  function exportHTML() {
    var rep = DC.buildReport(S.answers);
    var css = 'body{font-family:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;color:#18221f;background:#fff;max-width:44rem;margin:0 auto;padding:24px 16px 48px;line-height:1.55;font-size:16px}' +
      'h1,h2,h3{font-family:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;line-height:1.2}h1{font-size:1.8rem;margin:.2em 0 .6em}h2{font-size:1.25rem;margin:0 0 8px}' +
      'section{border-top:1px solid #d3d9d1;padding:18px 0}.secnum{color:#1d5c47;margin-right:6px}.muted,.disclaimer,.why{color:#56625d}.disclaimer{font-size:.88rem}' +
      '.label-said,.label-infer{display:inline-block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:4px}.label-said{background:#e2efe8;color:#1d5c47}.label-infer{border:1px dashed #56625d;color:#56625d}' +
      '.proposal{border:1.5px solid #1d5c47;border-radius:10px;padding:12px 16px;margin-bottom:10px}.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px}.kv dd{margin:0;font-weight:700}.kv dt{color:#56625d}' +
      '.features li{margin-bottom:8px}.why{display:block;font-size:.9rem}.solidity{border:1.5px solid #56625d;border-radius:10px;padding:12px 16px;display:flex;gap:12px}.sym{font-weight:700;text-transform:uppercase;font-size:.75rem;border:1.5px solid currentColor;border-radius:4px;padding:2px 8px;height:fit-content;white-space:nowrap}' +
      '.ask{border-left:3px solid #1d5c47;padding-left:12px;font-weight:700}.answers{padding-left:1.1rem}.answers li{margin-bottom:8px}.answers .q{color:#56625d;font-size:.92rem}' +
      '.top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}.brand{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700}' +
      'button{font:inherit;font-weight:700;padding:10px 18px;border-radius:8px;border:0;background:#1d5c47;color:#fff;cursor:pointer;margin:6px 0 10px}' +
      '@media print{.no-print{display:none}body{padding:0;font-size:11pt}section{break-inside:avoid}}';
    return '<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<title>Informe orientativo · Dinerocorp</title><style>' + css + '</style></head><body>' +
      '<div class="top"><span class="brand">Dinerocorp</span><span class="muted">Informe orientativo · ' + today() + '</span></div>' +
      '<h1>Tu propuesta de ayuda</h1>' +
      '<button class="no-print" onclick="window.print()">Imprimir / guardar como PDF</button>' +
      reportBody(rep, { withAnswers: true }) + '</body></html>';
  }

  var dlNs;
  function getDownloads() {
    if (!window.claude || typeof window.claude.use !== 'function') return Promise.resolve(null);
    if (!dlNs) dlNs = window.claude.use('downloads').catch(function () { return null; });
    return dlNs;
  }
  function inFrame() { try { return window.self !== window.top; } catch (e) { return true; } }

  function setMsg(m) { S.actionMsg = m; render(false); announce(m); }

  function doDownload() {
    var html = exportHTML();
    var filename = 'informe-dinerocorp-' + today() + '.html';
    getDownloads().then(function (dl) {
      if (dl) {
        return dl.save({ filename: filename, data: html }).then(function () {
          setMsg('Informe descargado. Al abrirlo encontrarás un botón para imprimirlo o guardarlo como PDF.');
        }, function (e) {
          if (e && e.code === 'declined') setMsg('Descarga cancelada.');
          else if (e && e.code === 'rate_limited') setMsg('Ya hay una descarga pendiente de confirmar.');
          else fallback();
        });
      }
      fallback();
    });
    function fallback() {
      try {
        var blob = new Blob([html], { type: 'text/html' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
        setMsg('Descarga iniciada: ' + filename + '. Si no aparece, tu navegador la ha bloqueado.');
      } catch (e) { setMsg('No se ha podido descargar el informe en esta vista.'); }
    }
  }

  function doPrint() {
    if (inFrame()) {
      setMsg('Desde esta vista no se puede abrir el diálogo de impresión. Descarga el informe: al abrirlo encontrarás un botón para imprimirlo o guardarlo como PDF.');
      return;
    }
    window.print();
  }

  /* ---------- Eventos ---------- */
  function bind() {
    var form = document.getElementById('qform');
    if (form) form.addEventListener('submit', function (e) { e.preventDefault(); onContinue(); });
    app.querySelectorAll('input[data-opt]').forEach(function (inp) {
      inp.addEventListener('change', function () { onChoice(inp.dataset.q, inp.dataset.opt, inp.checked); });
    });
    app.querySelectorAll('input[data-clar]').forEach(function (inp) {
      inp.addEventListener('change', function () { S.draft.qc.v[inp.dataset.clar] = inp.value; render(false, inp.id); });
    });
    app.querySelectorAll('[data-text]').forEach(function (inp) {
      inp.addEventListener('input', function () {
        var q = inp.dataset.text, k = inp.dataset.key;
        if (k === '__v') S.draft[q].v = inp.value; else S.draft[q].texts[k] = inp.value;
        var c = document.getElementById(inp.id + '-c');
        if (c) c.textContent = inp.value.length + ' / ' + inp.maxLength + ' caracteres';
      });
    });
    app.querySelectorAll('[data-act]').forEach(function (b) {
      b.addEventListener('click', function () {
        var act = b.dataset.act;
        if (act === 'start') { S.notice = null; goScreen(firstIncomplete() || 'q1', { focus: true }); }
        else if (act === 'back') { S.notice = null; onBack(); }
        else if (act === 'change-sit') { commitDraft(); S.notice = null; goScreen('q4', { focus: true }); }
        else if (act === 'toreport') { if (S.mode === 'q') { if (!validate()) { render(); return; } commitDraft(); } if (DC.isComplete(S.answers)) showReport(); else goScreen(firstIncomplete(), { focus: true }); }
        else if (act === 'review') { S.mode = 'review'; S.actionMsg = ''; render(true); }
        else if (act === 'download') doDownload();
        else if (act === 'print') doPrint();
        else if (act === 'reset') { S.confirmReset = true; render(false, null); var y = app.querySelector('[data-act="reset-yes"]'); if (y) y.focus(); }
        else if (act === 'reset-no') { S.confirmReset = false; render(false, null); }
        else if (act === 'reset-yes') { S.answers = {}; S.mode = 'intro'; S.confirmReset = false; S.actionMsg = ''; S.notice = null; render(true); announce('Respuestas borradas.'); }
      });
    });
    app.querySelectorAll('[data-goto]').forEach(function (b) {
      b.addEventListener('click', function () { S.fromReview = true; S.notice = null; goScreen(b.dataset.goto, { focus: true }); });
    });
  }

  /* Para pruebas automatizadas: acceso de solo lectura al estado */
  window.DC_APP = { state: function () { return S; }, exportHTML: exportHTML };

  render(false);
})();

</script>
