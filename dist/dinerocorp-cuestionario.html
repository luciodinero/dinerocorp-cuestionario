<style>
/* Layout: una sola columna de lectura, cabecera con marca y progreso, navegación fija al pie de cada pantalla. */
:root {
  --bg: #f3f5f1;
  --surface: #ffffff;
  --ink: #18221f;
  --muted: #56625d;
  --line: #d3d9d1;
  --accent: #1d5c47;
  --accent-ink: #ffffff;
  --sel-bg: #e2efe8;
  --warn-bg: #fdf3dc;
  --warn-ink: #6b4a00;
  --err: #a32121;
  --focus: #1f5fd1;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111614; --surface: #1a211e; --ink: #e5ebe7; --muted: #a0aca6; --line: #33403b;
    --accent: #72c6a3; --accent-ink: #0d1a14; --sel-bg: #1d3329; --warn-bg: #3a2f14; --warn-ink: #f2d68f;
    --err: #ff8f8f; --focus: #8fb6ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111614; --surface: #1a211e; --ink: #e5ebe7; --muted: #a0aca6; --line: #33403b;
  --accent: #72c6a3; --accent-ink: #0d1a14; --sel-bg: #1d3329; --warn-bg: #3a2f14; --warn-ink: #f2d68f;
  --err: #ff8f8f; --focus: #8fb6ff; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 17px; line-height: 1.55; margin: 0; }
.wrap { max-width: 63rem; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; }

.skip { position: absolute; left: -9999px; }
.skip:focus { left: 16px; top: 8px; background: var(--surface); padding: 8px 12px; z-index: 10; }

header.top { display: flex; flex-direction: column; gap: 12px; margin-bottom: 28px; }
.brandrow { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; letter-spacing: -0.01em; }
.brand-tag { font-size: .8rem; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.progress { display: flex; flex-direction: column; gap: 6px; }
.progress-text { font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }

h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; line-height: 1.2; letter-spacing: -0.015em; }
h1 { font-size: clamp(1.45rem, 4.2vw, 1.95rem); margin: 0 0 8px; font-weight: 650; }
h2 { font-size: 1.3rem; margin: 0 0 10px; font-weight: 650; }
h3 { font-size: 1.05rem; margin: 0 0 6px; }
h1:focus, h2:focus { outline: none; }
h1:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; border-radius: 4px; }

.eyebrow { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; font-weight: 700; }
.lead { color: var(--muted); margin: 0 0 4px; font-size: 1rem; }
.hint { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .92rem; color: var(--muted); margin: 6px 0 18px; }
.hint b { color: var(--ink); font-weight: 700; }
.muted { color: var(--muted); }

fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
fieldset + fieldset { margin-top: 28px; }
legend.subq { font-family: var(--font-display); font-weight: 650; font-size: 1.15rem; margin-bottom: 6px; padding: 0; }

.opts { display: grid; gap: 10px; }
.opts.compact { grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); }
.opt { display: flex; align-items: flex-start; gap: 12px; padding: 13px 14px; background: var(--surface); border: 1.5px solid var(--line);
  border-radius: var(--radius); cursor: pointer; transition: border-color .12s, background .12s; min-width: 0; }
.opt:hover { border-color: var(--muted); }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.mark { flex: none; width: 22px; height: 22px; margin-top: 1px; border: 2px solid var(--muted); background: var(--surface); display: grid; place-items: center; }
.opt.radio .mark { border-radius: 50%; }
.opt.check .mark { border-radius: 5px; }
.mark::after { content: ""; display: none; }
.opt.radio input:checked + .mark::after { display: block; width: 10px; height: 10px; border-radius: 50%; background: var(--accent-ink); }
.opt.check input:checked + .mark::after { display: block; width: 6px; height: 11px; border: solid var(--accent-ink); border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px, -1px); }
.opt input:checked + .mark { background: var(--accent); border-color: var(--accent); }
.opt:has(input:checked) { border-color: var(--accent); background: var(--sel-bg); }
.opt:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.opt:has(input:disabled) { opacity: .5; cursor: not-allowed; }
.opt .lbl { min-width: 0; overflow-wrap: anywhere; }
.opt .tag { display: block; font-size: .8rem; color: var(--muted); }
.sel-state { font-size: .78rem; font-weight: 700; color: var(--accent); margin-left: auto; padding-left: 8px; white-space: nowrap; }

.textfield { display: grid; gap: 6px; margin-top: 4px; }
.textfield.inline { margin: 2px 0 6px 34px; }
.textfield label { font-size: .92rem; color: var(--muted); }
.textfield input, .textfield textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; }
.textfield textarea { min-height: 6.5rem; resize: vertical; }
.textfield input:focus-visible, .textfield textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; border-color: var(--accent); }
.counter { font-size: .82rem; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

.notice { background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 12px 14px; margin: 0 0 18px; font-size: .95rem; display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.notice strong { font-weight: 700; }
.error { color: var(--err); font-weight: 700; margin: 14px 0 0; display: flex; gap: 8px; align-items: baseline; }
.error[hidden] { display: none; }
.live { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

.nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 32px; flex-wrap: wrap; }
.nav .right { display: flex; gap: 10px; flex-wrap: wrap; margin-left: auto; }
button, .btn { font: inherit; font-weight: 700; border-radius: 8px; padding: 12px 20px; cursor: pointer; border: 1.5px solid transparent; min-height: 48px; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn-ghost:hover { border-color: var(--muted); }
.btn-link { background: none; border: 0; color: var(--accent); padding: 4px 0; min-height: 0; text-decoration: underline; text-underline-offset: 3px; }
button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* Pantalla inicial */
.intro h1 { font-size: clamp(1.9rem, 6vw, 2.7rem); margin-bottom: 18px; max-width: 18ch; }
.intro p { max-width: 62ch; }
.intro .note { border-left: 3px solid var(--accent); padding: 4px 0 4px 14px; color: var(--muted); margin: 22px 0 28px; }
.intro .facts { display: flex; gap: 8px 22px; flex-wrap: wrap; font-size: .92rem; color: var(--muted); margin: 0 0 30px; padding: 0; list-style: none; }

/* Informe */
.report section { padding-block: 24px; border-top: 1px solid var(--line); }
.report section:first-of-type { border-top: 0; padding-top: 4px; }
.report p { margin: 0 0 10px; max-width: 65ch; }
.report ul { margin: 0 0 10px; padding-left: 1.2rem; display: grid; gap: 6px; }
.secnum { font-family: var(--font-display); color: var(--accent); font-weight: 700; margin-right: 6px; }
.label-said, .label-infer { display: inline-block; font-size: .75rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; margin-bottom: 6px; }
.label-said { background: var(--sel-bg); color: var(--accent); }
.label-infer { border: 1px dashed var(--muted); color: var(--muted); }
.proposal { background: var(--surface); border: 1.5px solid var(--accent); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 12px; }
.proposal p:last-child { margin-bottom: 0; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: .95rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 700; }
.features { list-style: none; padding: 0 !important; counter-reset: f; }
.features li { counter-increment: f; display: grid; grid-template-columns: 2rem 1fr; gap: 2px 8px; }
.features li::before { content: counter(f); font-family: var(--font-display); font-weight: 700; color: var(--accent); grid-row: span 2; }
.features .why { color: var(--muted); font-size: .9rem; }
.status { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--radius); background: var(--surface); border: 1.5px solid var(--line); }
.status .sym { font-family: var(--font-display); font-weight: 700; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; padding: 3px 8px; border-radius: 4px; white-space: nowrap; border: 1.5px solid currentColor; }
.status.ok .sym { color: var(--accent); }
.status.provisional .sym { color: var(--warn-ink); background: var(--warn-bg); }
.status.none .sym { color: var(--muted); }
.ask { border-left: 3px solid var(--accent); padding-left: 12px; font-weight: 700; }
.disclaimer { font-size: .88rem; color: var(--muted); margin-top: 8px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 22px; }
.actions-msg { font-size: .92rem; margin: -10px 0 18px; }
.confirm { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--warn-bg); color: var(--warn-ink); padding: 12px 14px; border-radius: 8px; margin-bottom: 18px; }

/* Revisión */
.review-list { list-style: none; padding: 0; margin: 0 0 24px; display: grid; gap: 0; }
.review-list li { padding: 14px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; align-items: start; }
.review-list .q { font-size: .92rem; color: var(--muted); }
.review-list .a { font-weight: 700; overflow-wrap: anywhere; }
.review-list button { grid-row: span 2; }

@media (max-width: 480px) {
  .nav { flex-direction: column-reverse; }
  .nav .right { margin-left: 0; }
  .nav button { width: 100%; }
  .textfield.inline { margin-left: 0; }
}

/* Pantallas de pregunta: columna principal + ayuda lateral (debajo del título en móvil) */
.narrow { max-width: 44rem; }
header.top { max-width: 44rem; }
.qlayout { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-areas: "head" "help" "body"; max-width: 44rem; }
.qhead { grid-area: head; min-width: 0; }
.qbody { grid-area: body; min-width: 0; }
.qhelp { grid-area: help; min-width: 0; font-size: .93rem; color: var(--muted); border-left: 3px solid var(--line); padding: 2px 0 2px 14px; margin: 4px 0 6px; }
.qhelp p { margin: 0 0 8px; }
.qhelp p:last-child { margin-bottom: 0; }
.qhelp .ex-label { font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2px; }
.qhelp .ex { color: var(--ink); opacity: .85; }
.qhelp .ex-note { font-size: .86rem; font-style: italic; }
@media (min-width: 900px) {
  header.top { max-width: none; }
  .qlayout.has-help { max-width: none; grid-template-columns: minmax(0, 42rem) 17rem; column-gap: 44px; grid-template-areas: "head help" "body help"; align-items: start; }
  .qlayout.has-help .qhelp { position: sticky; top: 24px; margin-top: 30px; }
}
.about { margin: 0 0 6px; font-size: .92rem; color: var(--muted); }
.textfield.spaced { margin-top: 16px; }
.sub { font-weight: 700; margin: 14px 0 6px; }
.small { font-size: .9rem; }
.st-label { margin: 0 0 4px !important; }
.st-reason { margin: 0 !important; }
.status.plausible .sym, .status.insuficiente .sym { color: var(--warn-ink); background: var(--warn-bg); }
.status.actual .sym, .status.norelevante .sym { color: var(--muted); }
.quote { font-style: italic; border-left: 3px solid var(--line); padding-left: 12px; overflow-wrap: anywhere; }
.triad { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 8px 0; }
.triad dt { color: var(--muted); font-size: .92rem; }
.triad dd { margin: 0; }
.prev .status { margin-top: 8px; }
@media (max-width: 560px) { .triad, .kv { grid-template-columns: minmax(0, 1fr); } .triad dd, .kv dd { margin-bottom: 6px; } }
@media print { .qhelp { display: none; } }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

@media print {
  body { background: #fff; color: #000; font-size: 11pt; }
  header.top .progress, .actions, .actions-msg, .nav, .skip, .confirm, .no-print { display: none !important; }
  .wrap { max-width: none; padding: 0; }
  .proposal, .status { border-color: #000; }
  .report section { break-inside: avoid; }
}

   - Reglas del informe: report.js

          text (texto libre, siempre opcional).

     exclusive: true        → al marcarla se desmarcan las demás
     incompatible: [ids]    → no puede combinarse con esas opciones
     textField: {...}       → campo opcional al marcar la opción

     help: { explain, examples, note }
   Criterio de ejemplos: situaciones cotidianas de ámbitos distintos,
   sin mencionar aplicaciones ni soluciones.

   explora una segunda situación; sus funciones reciben (a, d, ctx).

DC.EXAMPLE_NOTE = 'Son solo ejemplos; puede haberte ocurrido en otra situación.';

    help: { explain: 'Usamos las mismas categorías del cuestionario. No interpretamos tu texto de forma automática.' },
    options: function () { return DC.SIT_IDS.map(function (s) { return sitOption(s); }).concat([{ id: 'ninguna', label: 'A ninguna de estas' }]); }
  }
};

DC.SIT_IDS.forEach(function (s, i) {
  DC.QUESTIONS['q2' + s] = {
    type: 'single', section: 'Situaciones', sectionStep: (i + 1) + ' de ' + DC.SIT_IDS.length,
    title: DC.SITUATIONS[s].q,
    help: { explain: DC.SITUATIONS[s].help.explain, examples: DC.SITUATIONS[s].help.examples, note: DC.SITUATIONS[s].help.note || DC.EXAMPLE_NOTE },
    options: DC.SCALE,
    compact: true
  };
});

<script>
/* =====================================================================
   FLUJO Y RAMIFICACIÓN
   ---------------------------------------------------------------------
   Claves de respuesta:
     - Preguntas comunes: 'q1', 'q2A', 'q3', 'q12', 'q13'…
     - Preguntas por situación: '1.q6' (primera situación explorada),
       '2.q6' (segunda, como máximo una exploración adicional).
   derive()  → qué situaciones se exploran y por qué.
   path()    → lista ordenada de pantallas de la ruta activa.
   sig()     → firma de lo que condiciona cada respuesta; si cambia, la
               respuesta deja de ser válida y prune() la elimina. Las
               comunes (contexto, frecuencias, dificultades, condiciones
               de uso, comentario) se conservan al cambiar de situación.
   CONTRADICTIONS → aclaraciones opcionales antes del informe.
   ===================================================================== */
window.DC = window.DC || {};

DC.val = function (a, q) { return a[q] ? a[q].v : undefined; };
DC.has = function (a, q, id) { var v = DC.val(a, q); return Array.isArray(v) ? v.indexOf(id) !== -1 : v === id; };
DC.hasAny = function (a, q, ids) { return ids.some(function (id) { return DC.has(a, q, id); }); };
DC.text = function (a, q, key) { return (a[q] && a[q].texts && a[q].texts[key]) ? a[q].texts[key] : ''; };
DC.K = function (n, base) { return n + '.' + base; };
DC.baseOf = function (key) { var i = key.indexOf('.'); return i === -1 ? key : key.slice(i + 1); };
DC.routeOf = function (key) { var i = key.indexOf('.'); return i === -1 ? 0 : Number(key.slice(0, i)); };
DC.RV = function (a, n, base) { return DC.val(a, DC.K(n, base)); };

DC.scaleRank = function (v) {
  var o = DC.SCALE.filter(function (s) { return s.id === v; })[0];
  return o && o.rank ? o.rank : 0;
};

DC.derive = function (a) {
  var val = DC.val;
  var d = {
    occurred: [], candidates: [], uncertain: false, q2done: false,
    needsQ4: false, needsQ4b: false, needsQ4c: false, top: null, tied: [],
    altNeeded: false, altReason: null, route: 'pending',
    r1: null, r2: null, lastRoute: null, canExplore: true
  };
  DC.SIT_IDS.forEach(function (s) { if (DC.scaleRank(val(a, 'q2' + s)) > 0) d.occurred.push(s); });
  d.q2done = DC.SIT_IDS.every(function (s) { return !!val(a, 'q2' + s); });
  if (!d.q2done) return d;

  var goAlt = false;
  if (d.occurred.length === 0) { goAlt = true; d.altReason = 'sin-situaciones'; }
  else {
    var q3 = val(a, 'q3');
    if (!q3) return d;
    if (q3.indexOf('ninguna') !== -1) { goAlt = true; d.altReason = 'sin-dificultad'; }
    else {
      d.uncertain = q3.indexOf('noseguro') !== -1;
      d.candidates = d.uncertain ? d.occurred.slice() : q3.filter(function (s) { return d.occurred.indexOf(s) !== -1; });
      if (d.candidates.length === 1 && !d.uncertain) d.r1 = { n: 1, situation: d.candidates[0], source: 'single' };
      else {
        d.needsQ4 = true;
        var q4 = val(a, 'q4');
        if (!q4) return d;
        if (q4 === 'ninguna') { goAlt = true; d.altReason = 'no-explorar'; }
        else if (q4 === 'nopref') {
          d.needsQ4b = true;
          var q4b = val(a, 'q4b');
          if (!q4b) return d;
          if (d.candidates.indexOf(q4b) !== -1) d.r1 = { n: 1, situation: q4b, source: 'consequences' };
          else {
            d.needsQ4c = true;
            var max = Math.max.apply(null, d.candidates.map(function (s) { return DC.scaleRank(val(a, 'q2' + s)); }));
            d.tied = d.candidates.filter(function (s) { return DC.scaleRank(val(a, 'q2' + s)) === max; });
            d.top = d.tied.length === 1 ? d.tied[0] : null;
            var q4c = val(a, 'q4c');
            if (!q4c) return d;
            d.r1 = { n: 1, situation: q4c, source: q4c === d.top ? 'freq' : 'chosen' };
          }
        } else d.r1 = { n: 1, situation: q4, source: 'chosen' };
      }
    }
  }

  if (goAlt) {
    d.altNeeded = true;
    d.route = 'alt';
    var qa = val(a, 'qalt');
    if (!qa) return d;
    if (qa === 'nada') d.route = 'none';
    else d.r1 = { n: 1, situation: 'F', source: 'alt', alt: qa };
  }

  if (d.r1) {
    d.route = 'main';
    if (val(a, 'qconfirm') === 'otra' && val(a, 'qswitch')) d.r2 = { n: 2, situation: val(a, 'qswitch'), trigger: 'confirm' };
    d.canExplore = !d.r2;
    d.lastRoute = d.r2 || d.r1;
    var cc = val(a, 'qcclass');
    if (!d.r2 && val(a, 'qcomment') === 'explorar' && cc && cc !== 'ninguna' && cc !== d.r1.situation) {
      d.r2 = { n: 2, situation: cc, trigger: 'comment' };
    }
  } else if (d.route === 'none') {
    var cc2 = val(a, 'qcclass');
    if (val(a, 'qcomment') === 'explorar' && cc2 && cc2 !== 'ninguna') {
      d.r1 = { n: 1, situation: cc2, source: 'comment' };
      d.route = 'main';
      d.noneFirst = true;
    }
  }
  d.routes = [d.r1, d.r2].filter(Boolean);
  return d;
};

DC.routeObj = function (d, n) { return n === 1 ? d.r1 : n === 2 ? d.r2 : null; };

/* ¿Hace falta preguntar dónde están los materiales? Solo si la tarea usa
   materiales que una ayuda tendría que consultar. */
DC.needsAccess = function (a, n, r) {
  var mats = DC.hasAny(a, DC.K(n, 'q11'), ['archivos', 'videos', 'mensajes', 'app']);
  var rel = ['A', 'B', 'E', 'G'].indexOf(r.situation) !== -1 || ['dispersa', 'manual', 'herramienta'].indexOf(DC.RV(a, n, 'q7')) !== -1;
  return mats && rel;
};

/* Seguimiento de «aprender o practicar algo»: solo si la tarea no está concretada */
DC.needsLearnDetail = function (a, n, r) { return r.situation === 'F' && DC.RV(a, n, 'q6') === 'aprender'; };

/* «¿Qué acabaste haciendo?»: prioridad mínima. Solo con energía/ganas sin
   causa clara y si no hay otro seguimiento más útil en esta situación. */
DC.needsEnergyBehaviour = function (a, d, n) {
  if (DC.RV(a, n, 'q7') !== 'energia' || ['nolose', 'otra'].indexOf(DC.RV(a, n, 'q7b')) === -1) return false;
  var r = DC.routeObj(d, n);
  var other = DC.needsLearnDetail(a, n, r) || DC.RV(a, n, 'q9b') === 'sirve' || DC.has(a, 'q12', 'accesible') ||
    DC.clarification(a, n, 'c_consecuencia') === 'relevante';
  return !other;
};

DC.path = function (a, d) {
  d = d || DC.derive(a);
  var p = [];
  function add(id, qs, opt) { p.push({ id: id, qs: qs || [id], optional: !!opt }); }
  function block(n) {
    var r = DC.routeObj(d, n), K = function (b) { return DC.K(n, b); };
    add(K('q5')); add(K('q6'));
    if (DC.needsLearnDetail(a, n, r)) add(K('q6b'));
    add(K('q7'));
    if (DC.RV(a, n, 'q7') === 'energia') add(K('q7b'));
    add(K('q8'));
    if (!DC.has(a, K('q8'), 'nointentado')) add(K('q9'), [K('q9'), K('q9b')]);
    if (DC.RV(a, n, 'q9b') === 'sirve') {
      add(K('q9c'), [K('q9c'), K('q9d')]);
      if (['si', 'ocasiones'].indexOf(DC.RV(a, n, 'q9d')) !== -1) add(K('q9e'));
    }
    if (DC.scaleRank(DC.val(a, 'q2' + r.situation)) === 0) add(K('q10a'));
    add(K('q10b'));
    if (DC.has(a, K('q10b'), 'tiempo')) add(K('q10c'));
    add(K('q11'));
    if (DC.needsAccess(a, n, r)) add(K('q11c'));
  }
  /* Aclaraciones y seguimientos posteriores de una situación:
     contradicción → descripción de la consecuencia (si aclaró que sí la hay)
     → qué acabó haciendo (solo si no hay otro seguimiento más útil). */
  function clar(n) {
    if (DC.contradictions(a, d, n).length) add(DC.K(n, 'qc'), null, true);
    if (DC.clarification(a, n, 'c_consecuencia') === 'relevante') add(DC.K(n, 'qconsec'), null, true);
    if (DC.needsEnergyBehaviour(a, d, n)) add(DC.K(n, 'q7c'));
  }
  function common() { add('q12'); if (DC.has(a, 'q12', 'accesible')) add('qacc', null, true); }
  function commentTail() {
    add('q13', null, true);
    if (DC.val(a, 'q13')) {
      add('qcomment', ['qcomment', 'qcomment2']);
      if (['explorar', 'pendiente'].indexOf(DC.val(a, 'qcomment')) !== -1) add('qcclass');
    }
  }
  function estimate(k) { for (var i = 0; i < k; i++) p.push({ id: 'est' + i, qs: [], estimate: true }); }

  add('q1');
  DC.SIT_IDS.forEach(function (s) { add('q2' + s); });
  if (!d.q2done) { estimate(13); return p; }
  if (d.occurred.length) add('q3');
  if (d.needsQ4) add('q4');
  if (d.needsQ4b) add('q4b');
  if (d.needsQ4c) add('q4c');
  if (d.altNeeded) add('qalt');
  if (d.route === 'pending' || (d.route === 'alt' && !d.r1)) { estimate(12); return p; }

  if (d.r1 && !d.noneFirst) {
    block(1); common(); clar(1); add('qconfirm');
    if (DC.val(a, 'qconfirm') === 'otra') {
      add('qswitch');
      if (d.r2 && d.r2.trigger === 'confirm') { block(2); clar(2); }
    }
    commentTail();
    if (d.r2 && d.r2.trigger === 'comment') { block(2); clar(2); }
  } else {
    commentTail();
    if (d.r1) { block(1); common(); clar(1); }
  }
  return p;
};

DC.sig = function (key, a, d) {
  var base = DC.baseOf(key), n = DC.routeOf(key);
  if (n) {
    var r = DC.routeObj(d, n);
    if (!r) return '×';
    var s = r.situation;
    if (base === 'q5') s += '|' + (DC.val(a, 'q1') || []).join(',');
    if (base === 'qc') s += '|' + DC.contradictions(a, d, n).map(function (c) { return c.id; }).join(',');
    return s;
  }
  switch (key) {
    case 'q3': return d.occurred.join(',');
    case 'q4': return d.candidates.join(',') + '|' + d.uncertain;
    case 'q4b': return d.candidates.join(',');
    case 'q4c': return d.candidates.join(',') + '|' + DC.val(a, 'q4b');
    case 'qconfirm': case 'qswitch': return d.r1 && !d.noneFirst ? d.r1.situation : '';
    case 'qcomment': return (DC.val(a, 'q13') || '') + '|' + d.canExplore + '|' + !!(d.lastRoute);
    case 'qcomment2': case 'qcclass': return DC.val(a, 'q13') || '';
  }
  return '';
};

/* Respuestas generales que se conservan aunque su pantalla quede fuera de
   la ruta un momento (p. ej. mientras se vuelve a elegir la situación). */
DC.PERSIST = ['q1', 'q12', 'q13'];

DC.prune = function (a) {
  var removed = [];
  for (var i = 0; i < 15; i++) {
    var d = DC.derive(a);
    var on = {};
    DC.path(a, d).forEach(function (s) { s.qs.forEach(function (q) { on[q] = true; }); });
    var changed = false;
    Object.keys(a).forEach(function (q) {
      var off = !on[q] && DC.PERSIST.indexOf(q) === -1;
      if (off || a[q].sig !== DC.sig(q, a, d)) { delete a[q]; removed.push(q); changed = true; }
    });
    if (!changed) break;
  }
  return removed;
};

DC.commit = function (a, q, value, texts) {
  a[q] = { v: value, texts: texts || {}, sig: '' };
  a[q].sig = DC.sig(q, a, DC.derive(a));
};

DC.ctx = function (key, d) { var n = DC.routeOf(key); return { n: n, r: DC.routeObj(d, n) || {} }; };
function resolve(x, key, a, d) { return typeof x === 'function' ? x(a, d, DC.ctx(key, d)) : x; }
DC.def = function (key) { return DC.QUESTIONS[DC.baseOf(key)]; };
DC.optionsFor = function (key, a, d) { d = d || DC.derive(a); return resolve(DC.def(key).options, key, a, d) || []; };
DC.titleFor = function (key, a, d) { d = d || DC.derive(a); return resolve(DC.def(key).title, key, a, d); };
DC.helpFor = function (key, a, d) { d = d || DC.derive(a); return resolve(DC.def(key).help, key, a, d) || null; };
DC.labelOf = function (key, id, a, d) {
  var o = DC.optionsFor(key, a, d).filter(function (x) { return x.id === id; })[0];
  return o ? o.label : id;
};

DC.OPTIONAL_KEYS = ['qcomment2', 'qacc'];
DC.isAnswered = function (key, a) {
  var def = DC.def(key);
  if (def.type === 'text' || def.type === 'clarify' || DC.OPTIONAL_KEYS.indexOf(DC.baseOf(key)) !== -1) return true;
  var v = DC.val(a, key);
  return Array.isArray(v) ? v.length > 0 : !!v;
};
DC.screenDone = function (s, a) { return !s.estimate && (s.optional || s.qs.every(function (q) { return DC.isAnswered(q, a); })); };
DC.isComplete = function (a) {
  var d = DC.derive(a);
  if (d.route === 'pending' || (d.route === 'alt' && !d.r1)) return false;
  return DC.path(a, d).every(function (s) { return DC.screenDone(s, a); });
};

/* ---------- Respuestas aparentemente contradictorias (por situación) ---------- */
var STRONG = ['errores', 'gasto', 'oportunidad', 'impide'];
DC.CONTRADICTIONS = [
  {
    id: 'c_metodo', target: 'q9',
    test: function (a, d, n) {
      var K = function (b) { return DC.K(n, b); };
      return DC.val(a, K('q9')) === 'bien' && (DC.has(a, K('q8'), 'pospongo') || DC.hasAny(a, K('q10b'), ['errores', 'oportunidad', 'impide']));
    },
    text: function (a, d, n) {
      var K = function (b) { return DC.K(n, b); };
      var other = DC.has(a, K('q8'), 'pospongo') ? 'que sueles posponerla o dejarla sin terminar'
        : 'esta consecuencia: «' + DC.labelOf(K('q10b'), ['errores', 'oportunidad', 'impide'].filter(function (x) { return DC.has(a, K('q10b'), x); })[0], a, d) + '»';
      return 'Has indicado que tu forma actual te funciona bien y con poco esfuerzo, y también ' + other + '. ¿Qué se acerca más a tu caso?';
    },
    options: [
      { id: 'funciona', label: 'Me funciona bien; lo otro tiene una causa distinta' },
      { id: 'parcial', label: 'Me funciona solo a veces, o con más esfuerzo del que indiqué' },
      { id: 'nodecir', label: 'Prefiero no aclararlo' }
    ]
  },
  {
    id: 'c_consecuencia', target: 'q10b',
    test: function (a, d, n) {
      var r = DC.routeObj(d, n);
      return r && !d.uncertain && (DC.val(a, 'q3') || []).indexOf(r.situation) !== -1 && DC.has(a, DC.K(n, 'q10b'), 'ninguna');
    },
    text: function () { return 'Antes indicaste que esta situación te causó una dificultad que te importaba, y ahora que no tiene consecuencias relevantes. ¿Qué se acerca más a tu caso?'; },
    options: [
      { id: 'relevante', label: 'Sí tiene consecuencias, pero no encajaban en la lista' },
      { id: 'norelevante', label: 'En realidad no tiene consecuencias relevantes' },
      { id: 'nodecir', label: 'Prefiero no aclararlo' }
    ]
  },
  {
    id: 'c_cambio', target: 'q12',
    test: function (a, d, n) { return DC.has(a, 'q12', 'continuar') && DC.hasAny(a, DC.K(n, 'q10b'), STRONG); },
    text: function (a, d, n) {
      var c = STRONG.filter(function (x) { return DC.has(a, DC.K(n, 'q10b'), x); })[0];
      return 'Prefieres continuar como ahora, aunque indicaste esta consecuencia: «' + DC.labelOf(DC.K(n, 'q10b'), c, a, d) + '». ¿Qué se acerca más a tu caso?';
    },
    options: [
      { id: 'mantener', label: 'Prefiero mantener mi forma actual igualmente' },
      { id: 'abierto', label: 'Probaría algo si encaja con cómo lo hago' },
      { id: 'nodecir', label: 'Prefiero no aclararlo' }
    ]
  }
];

DC.contradictions = function (a, d, n) {
  d = d || DC.derive(a);
  if (!DC.routeObj(d, n)) return [];
  return DC.CONTRADICTIONS.filter(function (c) { return c.test(a, d, n); });
};
DC.clarification = function (a, n, id) { var v = DC.val(a, DC.K(n, 'qc')); return v && v[id] ? v[id] : null; };

/* ---------- Resumen de respuestas (revisión y exportación) ---------- */
DC.answerText = function (key, a, d) {
  var def = DC.def(key), ans = a[key];
  if (!ans) return null;
  if (def.type === 'text') return ans.v ? '«' + ans.v + '»' : 'Sin respuesta';
  var ids = Array.isArray(ans.v) ? ans.v : [ans.v];
  var out = ids.map(function (id) {
    var l = DC.labelOf(key, id, a, d);
    var t = ans.texts && ans.texts[id];
    return t ? l + ': «' + t + '»' : l;
  }).join('; ');
  if (def.extraText && ans.texts && ans.texts[def.extraText.key]) out += ' (indicada: «' + ans.texts[def.extraText.key] + '»)';
  return out;
};

DC.laterClarifications = function (key, a, d) {
  var base = DC.baseOf(key), n = DC.routeOf(key), out = [];
  (n ? [n] : [1, 2]).forEach(function (rn) {
    DC.contradictions(a, d, rn).forEach(function (c) {
      if (c.target !== base) return;
      var v = DC.clarification(a, rn, c.id);
      if (!v || v === 'nodecir') return;
      var lbl = c.options.filter(function (o) { return o.id === v; })[0].label;
      if (c.id === 'c_consecuencia' && v === 'relevante') {
        var t = DC.RV(a, rn, 'qconsec');
        lbl += t ? ' («' + t + '»)' : ' (sin describir todavía)';
      }
      out.push(lbl);
    });
  });
  return out;
};

DC.summary = function (a) {
  var d = DC.derive(a), rows = [];
  DC.path(a, d).forEach(function (s) {
    s.qs.forEach(function (key) {
      if (!a[key]) return;
      var def = DC.def(key), n = DC.routeOf(key);
      var prefix = (n === 2 ? '[Segunda situación] ' : '');
      if (def.type === 'text' && !a[key].v) return;
      /* Las aclaraciones se muestran junto a la respuesta que aclaran */
      if (def.type === 'clarify' || DC.baseOf(key) === 'qconsec') return;
      if (Array.isArray(a[key].v) && !a[key].v.length) return;
      var answer = DC.answerText(key, a, d);
      var later = DC.laterClarifications(key, a, d);
      if (later.length) answer = 'Respuesta inicial: ' + answer + '. Aclaración posterior: ' + later.join(' · ');
      rows.push({ q: key, screen: s.id, title: prefix + DC.titleFor(key, a, d), answer: answer });
    });
  });
  return rows;
};

</script>
<script>
/* =====================================================================
   GENERACIÓN DEL INFORME (reglas explícitas, sin servicios externos)
   ---------------------------------------------------------------------
   DC.buildReport(respuestas) devuelve:
     { main, previous, pending[], comment, scopeNote, empty }
   main / previous: informe de una situación explorada:
     { n, situationLabel, summary, evidence[], hypothesis, format,
       formatNote, inferences[], checks[], firstTest[], question,
       measure, status:{level,label,reason} }
   Para ampliarlo (p. ej. con un modelo de lenguaje), sustituye o
   complementa DC.buildReport manteniendo esa forma.

   Dónde tocar:
     CATALOG / ENERGY   → propuestas por situación, tarea y tipo de bloqueo
     MEASURES           → comprobación sugerida por situación
     PENDING_Q          → pregunta para situaciones pendientes
     decide()           → orden de las reglas de decisión
   El texto libre nunca se interpreta: solo se muestra como evidencia.
   ===================================================================== */
window.DC = window.DC || {};

(function () {
  var val = DC.val, has = DC.has, hasAny = DC.hasAny;

  var STATUS = {
    ok: 'Hay información suficiente para proponer una primera prueba',
    plausible: 'Hay una oportunidad plausible, pero faltan detalles',
    insuficiente: 'No tenemos información suficiente',
    actual: 'La solución actual parece adecuada',
    norelevante: 'No se ha identificado una necesidad relevante en lo explorado',
    sindescribir: 'Hay una necesidad, pero todavía no está bien descrita'
  };
  var SYMBOL = { ok: 'Lista para probar', plausible: 'Plausible', insuficiente: 'Faltan datos', actual: 'Adecuada', norelevante: 'Sin necesidad', sindescribir: 'Por describir' };

  var FORMATS = {
    feature: 'Una funcionalidad dentro de una herramienta que ya usas',
    web: 'Una web sencilla',
    app: 'Una aplicación',
    process: 'Un cambio en la forma de hacerlo',
    existing: 'Explorar primero una herramienta existente',
    moreinfo: 'Obtener más información antes de proponer algo',
    none: 'Ninguna intervención por ahora',
    keep: 'Mantener lo que ya te funciona',
    complement: 'Mantener lo que te funciona y complementarlo solo si hace falta'
  };

  /* f: [texto, motivo]  → motivo: task | obstacle | data | review | effort | measure */

    info.checks = [];
    if (cls === 'G' || (exploredN && DC.routeObj(d, exploredN).situation === 'G')) {
      info.checks.push('No damos por hecho acceso al vídeo, al audio ni a una transcripción, ni que un resultado automático sea exacto o ahorre tiempo.');
    }
    if (info.hasIdea) info.checks.push('Si la necesidad que describes se resuelve mejor con tu idea o con otra forma más sencilla.');
    return info;
  }

  DC.buildReport = function (a) {
    var d = DC.derive(a);
    var c = commentInfo(a, d);
    var ev = null;
    if (c) ev = 'Comentario final' + (c.relation === 'misma' ? ' (sobre esta situación)' : '') + ': ' + quote(c.text) + '.';
    var lastN = d.r2 ? 2 : d.r1 ? 1 : 0;
    var commentForMain = c && (c.relation === 'misma' || c.exploredN === lastN) ? ev : null;
    var main = lastN ? buildRoute(a, d, lastN, commentForMain) : null;
    var previous = lastN === 2 ? buildRoute(a, d, 1, null) : null;

    var explored = d.routes.map(function (r) { return r.situation; });
    var pending = d.candidates.filter(function (s) { return explored.indexOf(s) === -1; }).map(function (s) {
      return { short: DC.SITUATIONS[s].short, question: PENDING_Q[s] };
    });

    var limited = !main || ['insuficiente', 'actual', 'norelevante', 'sindescribir'].indexOf(main.status.level) !== -1;
    var scopeNote = 'Estas conclusiones se refieren solo a lo explorado en el cuestionario; no describen todas tus necesidades.';
    if (limited && (pending.length || (c && c.pending))) scopeNote += ' Quedan situaciones o información pendientes de explorar.';

    return {
      main: main, previous: previous, pending: pending, comment: c, scopeNote: scopeNote,
      empty: !main ? {
        text: d.altReason === 'sin-situaciones' ? 'No indicaste que te ocurriera ninguna de las situaciones exploradas en las últimas dos semanas, ni algo que quieras explorar ahora.'
          : d.altReason === 'no-explorar' ? 'Preferiste no explorar las situaciones que te ocurrieron y no indicaste otra actividad que quieras explorar ahora.'
            : 'Indicaste que las situaciones que te ocurrieron no te causaron una dificultad que te importara, y no hay otra actividad que quieras explorar ahora.',
        status: { level: 'norelevante', label: STATUS.norelevante, symbol: SYMBOL.norelevante, reason: 'Tus respuestas no señalan una dificultad ni una actividad que explorar.' }
      } : null
    };
  };

  DC.STATUS = STATUS;
  DC.FORMATS = FORMATS;
})();

</script>
<script>
/* =====================================================================
   INTERFAZ
   Las respuestas solo viven en la memoria de esta página: no se envían
   a ningún servidor ni se guardan en el navegador. Al cerrar o recargar
   la página se pierden, salvo que la persona descargue el informe.
   ===================================================================== */
(function () {
  var S = { answers: {}, mode: 'intro', screen: null, draft: {}, notice: null, fromReview: false, confirmReset: false, actionMsg: '', errors: {} };
  var app = document.getElementById('app');
  var live = document.getElementById('live');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  function sid(key) { return String(key).replace(/[^a-zA-Z0-9_-]/g, '_'); }
  function announce(msg) { live.textContent = ''; setTimeout(function () { live.textContent = msg; }, 30); }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  /* ---------- Navegación ---------- */
  function realPath() { return DC.path(S.answers).filter(function (s) { return !s.estimate; }); }
  function screenObj(id) { return realPath().filter(function (s) { return s.id === id; })[0]; }
  function firstIncomplete() {
    var p = realPath().filter(function (s) { return !DC.screenDone(s, S.answers); })[0];
    return p ? p.id : null;
  }
  function neighbour(id, step) {
    var p = realPath(), i = p.map(function (s) { return s.id; }).indexOf(id);
    if (i === -1) return null;
    var t = p[i + step];
    return t ? t.id : null;
  }

  function emptyDraft(key) {
    var t = DC.def(key).type;
    if (t === 'multi') return { v: [], texts: {} };
    if (t === 'clarify') return { v: {}, texts: {} };
    if (t === 'text') return { v: '', texts: {} };
    return { v: null, texts: {} };
  }

  function goScreen(id, focus) {
    var scr = screenObj(id);
    if (!scr) { var fi = firstIncomplete(); if (fi && fi !== id) return goScreen(fi, focus); return showReport(); }
    S.mode = 'q'; S.screen = id; S.errors = {}; S.draft = {};
    scr.qs.forEach(function (k) {
      S.draft[k] = S.answers[k] ? { v: clone(S.answers[k].v), texts: clone(S.answers[k].texts || {}) } : emptyDraft(k);
    });
    if (DC.baseOf(id) === 'q6' && !S.answers[id]) {
      var d = DC.derive(S.answers), r = DC.routeObj(d, DC.routeOf(id));
      if (r && r.source === 'alt' && DC.ALT_TO_TASK[r.alt]) S.draft[id].v = DC.ALT_TO_TASK[r.alt];
    }
    render(focus);
  }

  function commitDraft() {
    var scr = screenObj(S.screen);
    if (!scr) return;
    scr.qs.forEach(function (k) {
      var dr = S.draft[k]; if (!dr) return;
      var t = DC.def(k).type;
      if (t === 'text') dr.v = (dr.v || '').trim();
      Object.keys(dr.texts).forEach(function (x) { dr.texts[x] = (dr.texts[x] || '').trim(); if (!dr.texts[x]) delete dr.texts[x]; });
      var empty = t === 'multi' ? !dr.v.length : t === 'single' ? !dr.v : t === 'text' ? !dr.v : false;
      if (empty) delete S.answers[k];
      else DC.commit(S.answers, k, dr.v, dr.texts);
    });
    var removed = DC.prune(S.answers).filter(function (q) { return scr.qs.indexOf(q) === -1; });
    if (removed.length) {
      S.notice = removed.length === 1 ? 'Hemos quitado 1 respuesta que ya no aplica tras tu cambio. Las respuestas generales se conservan.'
        : 'Hemos quitado ' + removed.length + ' respuestas que ya no aplican tras tu cambio. Las respuestas generales se conservan.';
    }
  }

  function validate() {
    var scr = screenObj(S.screen);
    S.errors = {};
    scr.qs.forEach(function (k) {
      if (DC.isAnswered(k, (function () { var o = {}; o[k] = { v: S.draft[k].v }; return o; })())) return;
      S.errors[k] = DC.def(k).type === 'multi' ? 'Marca al menos una opción para continuar.' : 'Elige una opción para continuar.';
    });
    return Object.keys(S.errors).length === 0;
  }

  function onContinue() {
    if (!validate()) {
      render();
      var k = Object.keys(S.errors)[0];
      var first = app.querySelector('[data-qbox="' + sid(k) + '"] input');
      if (first) first.focus();
      announce('Falta una respuesta. ' + S.errors[k]);
      return;
    }
    var cur = S.screen;
    S.notice = null;
    commitDraft();
    var nx = neighbour(cur, 1);
    if (!nx && !screenObj(cur)) nx = firstIncomplete();
    if (nx) goScreen(nx, true);
    else if (DC.isComplete(S.answers)) showReport();
    else { var fi = firstIncomplete(); if (fi) goScreen(fi, true); else showReport(); }
  }

  function onBack() {
    var cur = S.screen;
    commitDraft();
    var pv = neighbour(cur, -1);
    if (pv) goScreen(pv, true);
    else { S.mode = 'intro'; render(true); }
  }

  function showReport() { S.mode = 'report'; S.fromReview = false; S.confirmReset = false; S.actionMsg = ''; S.notice = null; render(true); }

  /* ---------- Edición del borrador ---------- */
  function onChoice(key, optId, checked) {
    var def = DC.def(key), dr = S.draft[key];
    if (def.type === 'single') {
      Object.keys(dr.texts).forEach(function (x) { if (x !== optId) delete dr.texts[x]; });
      dr.v = optId;
    } else {
      var opts = DC.optionsFor(key, S.answers);
      var find = function (id) { return opts.filter(function (o) { return o.id === id; })[0]; };
      var opt = find(optId);
      if (checked) {
        if (opt.exclusive) {
          if (dr.v.filter(function (x) { return x !== optId; }).length) announce('Se han desmarcado las demás opciones: «' + opt.label + '» no se combina con ellas.');
          dr.v = [optId];
        } else {
          var drop = dr.v.filter(function (x) {
            var o = find(x);
            return (o && o.exclusive) || (opt.incompatible || []).indexOf(x) !== -1 || (o && (o.incompatible || []).indexOf(optId) !== -1);
          });
          if (drop.length) announce('Se ha desmarcado «' + find(drop[0]).label + '» porque no se combina con «' + opt.label + '».');
          dr.v = dr.v.filter(function (x) { return drop.indexOf(x) === -1; });
          if (!def.max || dr.v.length < def.max) dr.v.push(optId);
          if (def.max && dr.v.length >= def.max) announce('Has elegido el máximo de ' + def.max + '. Desmarca una para cambiarla.');
        }
      } else dr.v = dr.v.filter(function (x) { return x !== optId; });
      var keep = def.extraText ? def.extraText.key : null;
      Object.keys(dr.texts).forEach(function (x) { if (x !== keep && dr.v.indexOf(x) === -1) delete dr.texts[x]; });
      if (def.extraText && !def.extraText.showIf.some(function (h) { return dr.v.indexOf(h) !== -1; })) delete dr.texts[keep];
    }
    delete S.errors[key];
    render(false, 'opt-' + sid(key) + '-' + optId);
  }

  /* ---------- Progreso ---------- */
  function setProgress() {
    var box = document.getElementById('progress');
    if (S.mode !== 'q') { box.hidden = true; return; }
    box.hidden = false;
    var d = DC.derive(S.answers);
    var p = DC.path(S.answers, d);
    var pos = p.map(function (s) { return s.id; }).indexOf(S.screen) + 1;
    var estimated = p.some(function (s) { return s.estimate; });
    var pct = Math.round((pos - 1) / p.length * 100);
    document.getElementById('progress-text').textContent = 'Pantalla ' + pos + ' de ' + (estimated ? 'unas ' : '') + p.length + (estimated ? ' (depende de tus respuestas)' : '');
    document.getElementById('progress-bar').setAttribute('aria-valuenow', pct);
    document.getElementById('progress-fill').style.width = pct + '%';
  }

  function render(focusHeading, focusId) {
    setProgress();
    app.innerHTML = S.mode === 'intro' ? introHTML() : S.mode === 'q' ? screenHTML() : S.mode === 'report' ? reportScreenHTML() : reviewHTML();
    bind();
    if (focusId) { var el = document.getElementById(focusId); if (el) el.focus(); }
    else if (focusHeading) {
      var h = app.querySelector('h1');
      if (h) { h.setAttribute('tabindex', '-1'); h.focus(); }
      window.scrollTo(0, 0);
    }
  }

  function introHTML() {
    return '<div class="intro narrow">' +
      '<h1>Descubre qué podría facilitar tu día a día</h1>' +
      '<p>Responde unas preguntas sobre cómo haces algunas cosas cotidianas. Al terminar verás una propuesta orientativa de ayuda, basada en tus respuestas. No necesitas saber de tecnología ni tener una idea de aplicación.</p>' +
      '<p class="note">Piensa en las últimas dos semanas, salvo que indiquemos otra cosa. No incluyas información privada en los campos opcionales.</p>' +
      '<ul class="facts"><li>Duración prevista: unos 10 minutos (pendiente de comprobar)</li><li>Se responde con clics; escribir es opcional</li><li>Tus respuestas no salen de esta página</li></ul>' +
      '<button type="button" class="btn-primary" data-act="start">Empezar</button>' +
      '<p class="disclaimer">Es un cuestionario exploratorio, no un diagnóstico ni un instrumento validado científicamente.</p></div>';
  }

  function hintFor(def) {
    if (def.type === 'single') return '<span class="hint-ico" aria-hidden="true">◯</span><span><b>Elige una opción</b></span>';
    if (def.type === 'multi') return '<span class="hint-ico" aria-hidden="true">☐</span><span><b>' + (def.max ? 'Puedes elegir hasta ' + def.max : 'Puedes elegir varias') + '</b></span>';
    return '<span><b>Opcional</b></span>';
  }

  function helpHTML(h) {
    if (!h) return '';
    var o = '<aside class="qhelp" aria-label="Ayuda para responder">';
    if (h.explain) o += '<p>' + esc(h.explain) + '</p>';
    if (h.examples) o += '<p class="ex-label">Ejemplos</p><p class="ex">' + esc(h.examples) + '</p>';
    if (h.note) o += '<p class="ex-note">' + esc(h.note) + '</p>';
    return o + '</aside>';
  }

  function textField(id, label, max, value, dataText, dataKey, cls) {
    return '<div class="textfield ' + (cls || '') + '"><label for="' + id + '">' + esc(label) + '</label>' +
      '<input type="text" id="' + id + '" maxlength="' + max + '" value="' + esc(value) + '" data-text="' + esc(dataText) + '" data-key="' + esc(dataKey) + '" aria-describedby="' + id + '-c">' +
      '<span class="counter" id="' + id + '-c">' + value.length + ' / ' + max + ' caracteres</span></div>';
  }

  function optionsHTML(key, def, opts, dr) {
    var multi = def.type === 'multi', full = def.max && dr.v.length >= def.max, h = '';
    opts.forEach(function (o) {
      var checked = multi ? dr.v.indexOf(o.id) !== -1 : dr.v === o.id;
      var disabled = multi && !checked && full && !o.exclusive;
      var id = 'opt-' + sid(key) + '-' + o.id;
      var tag = multi && o.exclusive ? 'Si la marcas, se desmarcan las demás' : '';
      h += '<label class="opt ' + (multi ? 'check' : 'radio') + '" for="' + id + '">' +
        '<input type="' + (multi ? 'checkbox' : 'radio') + '" id="' + id + '" name="' + sid(key) + '" value="' + esc(o.id) + '"' +
        (checked ? ' checked' : '') + (disabled ? ' disabled' : '') + ' data-q="' + esc(key) + '" data-opt="' + esc(o.id) + '">' +
        '<span class="mark" aria-hidden="true"></span><span class="lbl">' + esc(o.label) + (tag ? '<span class="tag">' + tag + '</span>' : '') + '</span>' +
        (checked ? '<span class="sel-state" aria-hidden="true">Elegida</span>' : '') + '</label>';
      if (o.textField && checked) h += textField('txt-' + sid(key) + '-' + o.id, o.textField.label, o.textField.max, dr.texts[o.id] || '', key, o.id, 'inline');
    });
    return h;
  }

  function questionBlock(key, single, d) {
    var def = DC.def(key), dr = S.draft[key], title = DC.titleFor(key, S.answers, d), err = S.errors[key];
    var hid = 'h-' + sid(key), hintId = 'hint-' + sid(key), errId = 'err-' + sid(key);
    if (def.type === 'text') {
      var tid = 'txt-' + sid(key);
      return '<div data-qbox="' + sid(key) + '"><div class="textfield"><label for="' + tid + '">Escribe aquí (opcional)</label>' +
        '<textarea id="' + tid + '" maxlength="' + def.max + '" data-text="' + esc(key) + '" data-key="__v" aria-describedby="' + tid + '-c ' + hid + '">' + esc(dr.v || '') + '</textarea>' +
        '<span class="counter" id="' + tid + '-c">' + (dr.v || '').length + ' / ' + def.max + ' caracteres</span></div></div>';
    }
    if (def.type === 'clarify') return clarifyBlock(key, d);
    var opts = DC.optionsFor(key, S.answers, d), full = def.max && dr.v.length >= def.max;
    var optional = DC.OPTIONAL_KEYS.indexOf(DC.baseOf(key)) !== -1;
    var h = '<fieldset data-qbox="' + sid(key) + '" aria-describedby="' + hintId + (err ? ' ' + errId : '') + '"' + (err ? ' aria-invalid="true"' : '') + (single ? ' aria-labelledby="' + hid + '"' : '') + '>';
    if (!single) h += '<legend class="subq">' + esc(title) + '</legend>';
    h += '<p class="hint" id="' + hintId + '">' + hintFor(def) + (optional ? '<span>(opcional)</span>' : '') + (full ? '<span>· Has llegado al máximo; desmarca una para cambiarla.</span>' : '') + '</p>';
    h += '<div class="opts' + (def.compact ? ' compact' : '') + '">' + optionsHTML(key, def, opts, dr) + '</div>';
    if (def.extraText && def.extraText.showIf.some(function (x) { return dr.v.indexOf(x) !== -1; })) {
      h += textField('txt-' + sid(key) + '-' + def.extraText.key, def.extraText.label, def.extraText.max, dr.texts[def.extraText.key] || '', key, def.extraText.key, 'spaced');
    }
    h += '<p class="error" id="' + errId + '"' + (err ? '' : ' hidden') + '><span aria-hidden="true">⚠</span> <span>Falta una respuesta: ' + esc(err || '') + '</span></p></fieldset>';
    return h;
  }

  function clarifyBlock(key, d) {
    var n = DC.routeOf(key), dr = S.draft[key], h = '';
    DC.contradictions(S.answers, d, n).forEach(function (c) {
      var name = sid(key) + '-' + c.id;
      h += '<fieldset data-qbox="' + sid(key) + '"><legend class="subq">' + esc(c.text(S.answers, d, n)) + '</legend><p class="hint">' + hintFor({ type: 'single' }) + '<span>(opcional)</span></p><div class="opts">';
      c.options.forEach(function (o) {
        var id = 'opt-' + name + '-' + o.id, checked = dr.v[c.id] === o.id;
        h += '<label class="opt radio" for="' + id + '"><input type="radio" id="' + id + '" name="' + name + '" data-clarkey="' + esc(key) + '" data-clar="' + c.id + '" value="' + o.id + '"' + (checked ? ' checked' : '') + '>' +
          '<span class="mark" aria-hidden="true"></span><span class="lbl">' + esc(o.label) + '</span>' + (checked ? '<span class="sel-state" aria-hidden="true">Elegida</span>' : '') + '</label>';
      });
      h += '</div></fieldset>';
    });
    return h;
  }

  function contextLine(key, d) {
    var n = DC.routeOf(key);
    if (!n) return '';
    var r = DC.routeObj(d, n);
    if (!r) return '';
    var t = DC.val(S.answers, DC.K(n, 'q6'));
    var about = (n === 2 ? 'Segunda situación · ' : '') + 'Sobre: ' + DC.SITUATIONS[r.situation].short.toLowerCase();
    if (t && DC.baseOf(key) !== 'q6' && DC.baseOf(key) !== 'q5') {
      about = (n === 2 ? 'Segunda situación · ' : '') + (r.situation === 'G' ? 'Lo que más te cuesta: ' : 'Sobre la tarea: ') +
        (t === 'otra' ? (DC.text(S.answers, DC.K(n, 'q6'), 'otra') || 'otra tarea') : DC.labelOf(DC.K(n, 'q6'), t, S.answers, d).toLowerCase());
    }
    return '<p class="about">' + esc(about) + '</p>';
  }

  function screenHTML() {
    var scr = screenObj(S.screen), d = DC.derive(S.answers);
    var first = scr.qs[0], def = DC.def(first);
    var help = null;
    scr.qs.forEach(function (k) { if (!help) help = DC.helpFor(k, S.answers, d); });
    var isClar = def.type === 'clarify';
    var single = scr.qs.length === 1 && !isClar;
    var head = '<p class="eyebrow">' + esc(def.section) + (def.sectionStep ? ' · ' + esc(def.sectionStep) : '') + '</p>';
    if (S.notice) head += '<div class="notice" role="status"><strong>Aviso:</strong> <span>' + esc(S.notice) + '</span></div>';
    if (DC.baseOf(first) === 'q5' && DC.routeOf(first) === 1 && d.r1 && d.r1.source === 'freq') {
      head += '<div class="notice"><span>Exploramos «' + esc(DC.SITUATIONS[d.r1.situation].short) + '» por ser la más frecuente, como criterio provisional.</span> <button type="button" class="btn-link" data-act="change-sit">Elegir otra</button></div>';
    }
    head += contextLine(first, d);
    if (isClar) head += '<h1>Antes del informe, una aclaración opcional</h1><p class="muted">Algunas respuestas parecen no encajar entre sí. No las corregimos por ti: puedes aclararlo o continuar sin responder.</p>';
    else if (single) head += '<h1 id="h-' + sid(first) + '">' + esc(DC.titleFor(first, S.answers, d)) + '</h1>';
    else head += '<h1>' + esc(DC.titleFor(first, S.answers, d)) + '</h1>';

    var body = '';
    if (single || isClar) body += questionBlock(first, true, d);
    else scr.qs.forEach(function (k, i) { body += i === 0 ? questionBlock(k, true, d).replace('aria-labelledby', 'data-x') : questionBlock(k, false, d); });

    var isLast = !neighbour(S.screen, 1);
    var nav = '<div class="nav"><button type="button" class="btn-ghost" data-act="back">Atrás</button><div class="right">';
    if (S.fromReview && DC.isComplete(S.answers) && !isLast) nav += '<button type="button" class="btn-ghost" data-act="toreport">Volver al informe</button>';
    nav += '<button type="submit" class="btn-primary">' + (isLast && DC.isComplete(Object.assign({}, S.answers)) ? 'Ver informe' : 'Continuar') + '</button></div></div>';

    return '<form id="qform" novalidate><div class="qlayout' + (help ? ' has-help' : '') + '">' +
      '<div class="qhead">' + head + '</div>' + helpHTML(help) + '<div class="qbody">' + body + nav + '</div></div></form>';
  }

  /* ---------- Informe ---------- */
  function list(items) { return '<ul>' + items.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>'; }

  function statusHTML(st) {
    return '<div class="status ' + st.level + '"><span class="sym">' + esc(st.symbol) + '</span><div><p class="st-label"><strong>' + esc(st.label) + '.</strong></p><p class="st-reason">' + esc(st.reason) + '</p></div></div>';
  }

  function commentHTML(c, mainExplored) {
    if (!c) return '';
    var h = '<section class="comment"><h2>' + (c.pending ? 'Información adicional pendiente de explorar' : 'Tu comentario') + '</h2>';
    h += '<p class="quote">«' + esc(c.text) + '»</p>';
    var rows = [];
    if (c.classification) rows.push(['La experiencia que describes', 'La has relacionado con: ' + c.classification + '.']);
    else if (c.relation === 'misma') rows.push(['La experiencia que describes', 'La has relacionado con la situación explorada.']);
    else if (c.hasExperience) rows.push(['La experiencia que describes', 'Indicaste que describe una dificultad o algo que quieres hacer.']);
    if (c.hasIdea) rows.push(['La solución que imaginas', 'Tu comentario incluye una idea de cómo resolverlo. La tomamos como una pista, no como una recomendación validada.']);
    var falta = (c.question ? [c.question] : []).concat(c.checks);
    if (falta.length) rows.push(['Lo que falta comprobar', falta.join(' ')]);
    if (rows.length) {
      h += '<dl class="triad">';
      rows.forEach(function (r) { h += '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>'; });
      h += '</dl>';
    }
    if (c.pending) h += '<p class="muted">No la hemos convertido en una recomendación porque todavía no se ha explorado.</p>';
    return h + '</section>';
  }

  function routeHTML(m) {
    var h = '';
    h += '<section><h2>Situación explorada</h2><p>' + esc(m.summary) + '</p></section>';
    h += '<section><h2>Evidencia</h2><span class="label-said">Has indicado</span>' + list(m.evidence) + '</section>';
    h += '<section><h2>Posible ayuda</h2><span class="label-infer">' + ((m.status.level === 'ok' || m.status.level === 'plausible') ? 'Hipótesis' : 'Valoración') + '</span><div class="proposal"><p>' + esc(m.hypothesis) + '</p>' +
      (m.extraHypothesis ? '<p class="muted">' + esc(m.extraHypothesis) + '</p>' : '') + '</div>';
    h += '<dl class="kv"><dt>Formato</dt><dd>' + esc(m.format) + '</dd></dl>';
    if (m.formatNote) h += '<p class="muted small">' + esc(m.formatNote) + '</p>';
    if (m.inferences.length) h += '<p class="sub">Esto sugiere:</p>' + list(m.inferences);
    if (m.requirements.length) h += '<p class="sub">Condiciones que tendría que cumplir cualquier ayuda:</p>' + list(m.requirements);
    if (m.checks.length) h += '<p class="sub">Antes de construir nada, falta comprobar:</p>' + list(m.checks);
    h += '</section>';
    h += '<section><h2>Primera prueba</h2>';
    if (m.firstTest.length) {
      h += '<ol class="features">' + m.firstTest.map(function (f) { return '<li><span>' + esc(f.text) + '</span><span class="why">' + esc(f.why) + '</span></li>'; }).join('') + '</ol>';
    } else h += '<p>' + esc(m.firstTestNote) + '</p>';
    h += '</section>';
    h += '<section><h2>Pregunta pendiente más importante</h2>' + (m.question ? '<p class="ask">' + esc(m.question) + '</p>' : '<p>Ninguna esencial para esta situación.</p>') +
      (m.pendingPoints.length ? '<p class="sub">Otros puntos pendientes:</p>' + list(m.pendingPoints) : '') + '</section>';
    h += '<section><h2>Cómo comprobar si ayuda</h2><p>' + esc(m.measure || 'No aplica mientras no haya una propuesta que probar.') + '</p></section>';
    h += '<section><h2>Estado de la propuesta</h2>' + statusHTML(m.status) + '</section>';
    return h;
  }

  function reportBody(rep, withAnswers) {
    var h = '';
    if (rep.main) h += routeHTML(rep.main);
    else h += '<section><h2>Situación explorada</h2><p>' + esc(rep.empty.text) + '</p></section><section><h2>Estado</h2>' + statusHTML(rep.empty.status) + '</section>';
    if (rep.previous) {
      var p = rep.previous;
      h += '<section class="prev"><h2>Situación explorada antes</h2><p><strong>' + esc(p.situationLabel) + '.</strong> ' + esc(p.summary.replace(/^Situación: [^.]*\.\s*/, '')) + '</p>' +
        '<p>' + esc(p.hypothesis) + '</p>' + (p.extraHypothesis ? '<p class="muted">' + esc(p.extraHypothesis) + '</p>' : '') +
        (p.question ? '<p class="muted">Pregunta pendiente: ' + esc(p.question) + '</p>' : '') + statusHTML(p.status) + '</section>';
    }
    h += commentHTML(rep.comment);
    if (rep.pending.length) {
      h += '<section><h2>Otras situaciones pendientes</h2><p class="muted">Indicaste que te causaron una dificultad, pero no las hemos explorado.</p><ul>' +
        rep.pending.map(function (s) { return '<li><strong>' + esc(s.short) + '.</strong> <span class="muted">Para explorarla: ' + esc(s.question) + '</span></li>'; }).join('') + '</ul></section>';
    }
    h += '<p class="disclaimer">' + esc(rep.scopeNote) + ' Informe orientativo generado con reglas fijas a partir de tus respuestas, sin inteligencia artificial. El cuestionario es exploratorio: no es un diagnóstico ni un instrumento validado.</p>';
    if (withAnswers) {
      h += '<section><h2>Tus respuestas</h2><ul class="answers">' + DC.summary(S.answers).map(function (r) {
        return '<li><span class="q">' + esc(r.title) + '</span><br><strong>' + esc(r.answer) + '</strong></li>';
      }).join('') + '</ul></section>';
    }
    return h;
  }

  function reportScreenHTML() {
    var rep = DC.buildReport(S.answers);
    var h = '<div class="report narrow"><p class="eyebrow">Informe orientativo</p><h1>Tu propuesta de ayuda</h1>' +
      '<div class="actions"><button type="button" class="btn-ghost" data-act="review">Revisar mis respuestas</button>' +
      '<button type="button" class="btn-ghost" data-act="download">Descargar informe</button>' +
      '<button type="button" class="btn-ghost" data-act="print">Imprimir / guardar como PDF</button>' +
      '<button type="button" class="btn-ghost" data-act="reset">Empezar de nuevo</button></div>';
    if (S.actionMsg) h += '<p class="actions-msg" role="status">' + esc(S.actionMsg) + '</p>';
    if (S.confirmReset) h += '<div class="confirm" role="alert"><span>¿Empezar de nuevo? Se borrarán todas tus respuestas de esta página.</span>' +
      '<button type="button" class="btn-primary" data-act="reset-yes">Sí, borrar y empezar</button><button type="button" class="btn-ghost" data-act="reset-no">Cancelar</button></div>';
    return h + reportBody(rep, false) + '</div>';
  }

  function reviewHTML() {
    var h = '<div class="narrow"><p class="eyebrow">Tus respuestas</p><h1>Revisar mis respuestas</h1>' +
      '<p class="muted">Si cambias una respuesta que decide qué se explora, se quitarán solo las respuestas específicas que dejen de aplicar.</p><ul class="review-list">';
    DC.summary(S.answers).forEach(function (r) {
      h += '<li><span class="q">' + esc(r.title) + '</span><button type="button" class="btn-link" data-goto="' + esc(r.screen) + '" aria-label="Cambiar: ' + esc(r.title) + '">Cambiar</button><span class="a">' + esc(r.answer) + '</span></li>';
    });
    return h + '</ul><button type="button" class="btn-primary" data-act="toreport">Volver al informe</button></div>';
  }

  /* ---------- Exportación ---------- */
  function today() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

  function exportHTML() {
    var rep = DC.buildReport(S.answers);
    var css = 'body{font-family:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;color:#18221f;background:#fff;max-width:44rem;margin:0 auto;padding:24px 16px 48px;line-height:1.55;font-size:16px}' +
      'h1,h2{font-family:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;line-height:1.2}h1{font-size:1.8rem;margin:.2em 0 .6em}h2{font-size:1.2rem;margin:0 0 8px}' +
      'section{border-top:1px solid #d3d9d1;padding:16px 0}.muted,.disclaimer,.why{color:#56625d}.disclaimer{font-size:.88rem}.small{font-size:.9rem}.sub{font-weight:700;margin:12px 0 4px}' +
      '.label-said,.label-infer{display:inline-block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:4px;margin-bottom:6px}.label-said{background:#e2efe8;color:#1d5c47}.label-infer{border:1px dashed #56625d;color:#56625d}' +
      '.proposal{border:1.5px solid #1d5c47;border-radius:10px;padding:10px 16px;margin-bottom:10px}.kv,.triad{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px}.kv dd,.triad dd{margin:0}.kv dd{font-weight:700}.kv dt,.triad dt{color:#56625d}' +
      '.features li{margin-bottom:8px}.why{display:block;font-size:.9rem}.status{border:1.5px solid #56625d;border-radius:10px;padding:10px 16px;display:flex;gap:12px}.status p{margin:0 0 4px}.sym{font-weight:700;text-transform:uppercase;font-size:.72rem;border:1.5px solid currentColor;border-radius:4px;padding:2px 8px;height:fit-content;white-space:nowrap}' +
      '.ask{border-left:3px solid #1d5c47;padding-left:12px;font-weight:700}.quote{font-style:italic;border-left:3px solid #d3d9d1;padding-left:12px}.answers{padding-left:1.1rem}.answers li{margin-bottom:8px}.answers .q{color:#56625d;font-size:.92rem}' +
      '.top{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}.brand{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700}' +
      'button{font:inherit;font-weight:700;padding:10px 18px;border-radius:8px;border:0;background:#1d5c47;color:#fff;cursor:pointer;margin:6px 0 10px}' +
      '@media (max-width:480px){.kv,.triad{grid-template-columns:1fr}}@media print{.no-print{display:none}body{padding:0;font-size:11pt}section{break-inside:avoid}}';
    return '<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
      '<title>Informe orientativo · Dinerocorp</title><style>' + css + '</style></head><body>' +
      '<div class="top"><span class="brand">Dinerocorp</span><span class="muted">Informe orientativo · ' + today() + '</span></div>' +
      '<h1>Tu propuesta de ayuda</h1><button class="no-print" onclick="window.print()">Imprimir / guardar como PDF</button>' +
      reportBody(rep, true) + '</body></html>';
  }

  var dlNs;
  function getDownloads() {
    if (!window.claude || typeof window.claude.use !== 'function') return Promise.resolve(null);
    if (!dlNs) dlNs = window.claude.use('downloads').catch(function () { return null; });
    return dlNs;
  }
  function inFrame() { try { return window.self !== window.top; } catch (e) { return true; } }
  function setMsg(m) { S.actionMsg = m; render(false); announce(m); }

  function doDownload() {
    var html = exportHTML(), filename = 'informe-dinerocorp-' + today() + '.html';
    function fallback() {
      try {
        var url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
        var a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
        setMsg('Descarga iniciada: ' + filename + '. Al abrirlo encontrarás un botón para imprimirlo o guardarlo como PDF.');
      } catch (e) { setMsg('No se ha podido descargar el informe en esta vista.'); }
    }
    getDownloads().then(function (dl) {
      if (!dl) return fallback();
      dl.save({ filename: filename, data: html }).then(function () {
        setMsg('Informe descargado. Al abrirlo encontrarás un botón para imprimirlo o guardarlo como PDF.');
      }, function (e) {
        if (e && e.code === 'declined') setMsg('Descarga cancelada.');
        else if (e && e.code === 'rate_limited') setMsg('Ya hay una descarga pendiente de confirmar.');
        else fallback();
      });
    });
  }

  function doPrint() {
    if (inFrame()) { setMsg('Desde esta vista no se puede abrir el diálogo de impresión. Descarga el informe: al abrirlo encontrarás un botón para imprimirlo o guardarlo como PDF.'); return; }
    window.print();
  }

  /* ---------- Eventos ---------- */
  function bind() {
    var form = document.getElementById('qform');
    if (form) form.addEventListener('submit', function (e) { e.preventDefault(); onContinue(); });
    app.querySelectorAll('input[data-opt]').forEach(function (inp) {
      inp.addEventListener('change', function () { onChoice(inp.dataset.q, inp.dataset.opt, inp.checked); });
    });
    app.querySelectorAll('input[data-clar]').forEach(function (inp) {
      inp.addEventListener('change', function () { S.draft[inp.dataset.clarkey].v[inp.dataset.clar] = inp.value; render(false, inp.id); });
    });
    app.querySelectorAll('[data-text]').forEach(function (inp) {
      inp.addEventListener('input', function () {
        var k = inp.dataset.text, x = inp.dataset.key;
        if (x === '__v') S.draft[k].v = inp.value; else S.draft[k].texts[x] = inp.value;
        var c = document.getElementById(inp.id + '-c');
        if (c) c.textContent = inp.value.length + ' / ' + inp.maxLength + ' caracteres';
      });
    });
    app.querySelectorAll('[data-act]').forEach(function (b) {
      b.addEventListener('click', function () {
        var act = b.dataset.act;
        if (act === 'start') { S.notice = null; goScreen(firstIncomplete() || 'q1', true); }
        else if (act === 'back') { S.notice = null; onBack(); }
        else if (act === 'change-sit') { commitDraft(); S.notice = null; goScreen(screenObj('q4c') ? 'q4c' : 'q4', true); }
        else if (act === 'toreport') {
          if (S.mode === 'q') { if (!validate()) { render(); return; } commitDraft(); }
          if (DC.isComplete(S.answers)) showReport(); else goScreen(firstIncomplete(), true);
        }
        else if (act === 'review') { S.mode = 'review'; S.actionMsg = ''; render(true); }
        else if (act === 'download') doDownload();
        else if (act === 'print') doPrint();
        else if (act === 'reset') { S.confirmReset = true; render(false); var y = app.querySelector('[data-act="reset-yes"]'); if (y) y.focus(); }
        else if (act === 'reset-no') { S.confirmReset = false; render(false); }
        else if (act === 'reset-yes') { S.answers = {}; S.mode = 'intro'; S.confirmReset = false; S.actionMsg = ''; S.notice = null; render(true); announce('Respuestas borradas.'); }
      });
    });
    app.querySelectorAll('[data-goto]').forEach(function (b) {
      b.addEventListener('click', function () { S.fromReview = true; S.notice = null; goScreen(b.dataset.goto, true); });
    });
  }

  window.DC_APP = { state: function () { return S; }, exportHTML: exportHTML };
  render(false);
})();

</script>
